eb browsing or non-S&amp;P/ProntoNLP sources were used. A separate data-provenance document logs every tool call.<\/p>"}]},{"id":"executive-summary","num":"1","title":"Executive summary","blocks":[{"t":"c","id":"executive-summary--1","html":"<p><strong>The debate.<\/strong> On 18-Nov-2025 Coupang discovered that a former employee had accessed personal data on up to 33 million customer accounts (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000253203320-0\">#0<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000253203320-2\">#2<\/a>). Since then the shares have fallen 61% from the September-2025 high of US$34.08 to a low of US$13.35 (2-Oct-2026) \u2021. The Asian Century Stocks newsletter (11-Oct-2026, \u201cA temporary glitch?\u201d) asks whether this is a Vernon-style \u201cglitch\u201d, a temporary market overreaction, or a lasting change. Our answer: <strong>at the customer level the evidence says glitch; at the P&amp;L, balance-sheet and regulatory level the damage is real but finite and mostly priced.<\/strong><\/p><p><strong>What the data shows<\/strong><\/p><ul>\n<li><strong>Customers came back.<\/strong>\n<ul>\n<li>Product Commerce active customers recovered to <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264557825-29\">24.7m<\/a> in Q2\u201926, above the Q4\u201925 level.<\/li>\n<li>WOW membership is above pre-incident levels and at an all-time high (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-39\">#39<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-271\">#271<\/a>).<\/li>\n<li>Returners skew to higher spenders and \u201chave not split that spend with other alternatives\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-268\">#268<\/a>).<\/li>\n<li>Spend excluding non-returning customers grew ~16% against 8% reported Product Commerce growth (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-43\">#43<\/a>). This is a company-defined metric.<\/li>\n<\/ul><\/li>\n<li><strong>Margins did not come back yet.<\/strong>\n<ul>\n<li>Product Commerce adjusted EBITDA margin fell from <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-86\">8.8%<\/a> (Q3\u201925) to <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-169\">5.1%<\/a> (Q2\u201926).<\/li>\n<li>Consolidated adjusted EBITDA margin fell from <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-122\">4.5%<\/a> to <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-201\">1.8%<\/a>.<\/li>\n<li>GAAP operating losses were <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=259645823&amp;uctSearch=-242.000000\">-US$242m<\/a> in Q1\u201926 and <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057&amp;uctSearch=-556.000000\">-US$556m<\/a> in Q2\u201926. Q2 includes ~US$410m of privacy fines (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000261784634-8\">#8<\/a>).<\/li>\n<li>Management now targets pre-incident Product Commerce margins \u201cby mid-2027\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-220\">#220<\/a>). The recovery date has slipped once already.<\/li>\n<\/ul><\/li>\n<li><strong>Reported USD numbers understate the business.<\/strong>\n<ul>\n<li>The KRW hit a 15-year-plus low in Q2\u201926 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-150\">#150<\/a>) and took 7pts off Product Commerce growth (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-60\">#60<\/a>).<\/li>\n<li>Consolidated revenue grew +10% in constant currency but +4% in USD (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-180\">#180<\/a>).<\/li>\n<li>The ~US$1.2bn customer voucher programme was netted against revenue. Redemption ended mid-April 2026 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-16\">#16<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-17\">#17<\/a>), which flatters 2027 comparisons.<\/li>\n<\/ul><\/li>\n<li><strong>Valuation is near a five-year low on sales but not on earnings.<\/strong>\n<ul>\n<li>LTM EV/Sales is 0.79x [d], against year-end readings of 1.10-1.29x in 2022-25 [d] and a peer median of 1.29x.<\/li>\n<li>EV/EBITDA and P/E are optically high on trough earnings.<\/li>\n<li>On our EV/Sales vs EBIT-margin regression across 14 listed peers, CPNG sits on the line. The market is valuing Coupang as if today\u2019s ~1-2% margins are permanent.<\/li>\n<\/ul><\/li>\n<\/ul><p><strong>Why BUY now (event-driven framing)<\/strong><\/p><ol type=\"1\">\n<li><strong>Catalysts.<\/strong> The Q3\u201926 print is on 3-Nov-2026 (<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_upcoming-doc-704377650\">Q3 2026 Earnings Call<\/a>). 2027 guidance is promised \u201ctowards the end of the year\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-221\">#221<\/a>). The KFTC Eats-WOW bundling decision is pending (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-452\">#452<\/a>).<\/li>\n<li><strong>Downside cushion.<\/strong> Large buybacks: 43.7m shares (US$850m) in H1\u201926 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-369\">#369<\/a>), with US$907m of authorisation remaining (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-140\">#140<\/a>).<\/li>\n<li><strong>Asymmetry.<\/strong> Bear US$9.5 (-40%) / base US$21.0 (+33%) / bull US$31.8 (+101%), weighted 25/50/25. The probability-weighted value is US$20.8 (+32%) [e].<\/li>\n<\/ol><p><strong>What must go right<\/strong><\/p><ul>\n<li>Product Commerce margin recovers toward ~8% through 2027.<\/li>\n<li>Developing Offerings losses fall from US$950m-1bn in 2026 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-223\">#223<\/a>).<\/li>\n<li>No forced Eats-WOW unbundling or night-delivery ban.<\/li>\n<li>Merchant settlement-period rules from Dec-2026 do not unwind much of the negative-working-capital float (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-619\">#619<\/a>).<\/li>\n<\/ul><p><strong>What would make us wrong<\/strong><\/p><ul>\n<li>FCF stays near zero (LTM ~US$99m [d]) while the buyback is funded by the revolver (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-165\">#165<\/a>).<\/li>\n<li>Korean regulators keep fining. Cumulative accrued fines since 2024 are ~US$531m [d].<\/li>\n<li>Naver and the Chinese cross-border platforms keep the share they won during the incident.<\/li>\n<\/ul>"},{"t":"table","head":["Snapshot (US$m unless stated)","FY2023","FY2024","FY2025","LTM Jun-26","FY2026E","FY2027E","FY2028E"],"rows":[["Revenue","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=24383.000000\">24,383<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=30268.000000\">30,268<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=34534.000000\">34,534<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057\">35,462<\/a>","36,686 [e]","41,139 [e]","45,817 [e]"],["Adj. EBITDA (company)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-32\">~1,100<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237406755-44\">~1,400<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-45\">~1,500<\/a>","872 [d]","608 [e]","1,689 [e]","2,625 [e]"],["GAAP operating income","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=473.000000\">473<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=388.000000\">388<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=498.000000\">498<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057\">-603<\/a>","-1,117 [e]","529 [e]","1,225 [e]"],["Net income to CPNG","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=1360.000000\">1,360<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=154.000000\">154<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=208.000000\">208<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057\">-767<\/a>","-1,195 [e]","256 [e]","753 [e]"],["Diluted EPS (US$)","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354\">0.75<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354\">0.08<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354\">0.11<\/a>","-0.43 [d]","-0.67 [e]","0.14 [e]","0.42 [e]"],["EV/Sales (x)","1.10 [d]","1.29 [d]","1.19 [d]","0.79 [d]","0.76 [e]","0.68 [e]","0.61 [e]"],["EV/Adj. EBITDA (x)","25.0 [d]","28.7 [d]","27.6 [d]","32.1 [d]","46.0 [e]","16.6 [e]","10.7 [e]"]]},{"t":"c","id":"executive-summary--2","html":"<p><em>Historical EV multiples use year-end prices and S&amp;P diluted shares and net debt (incl.\u00a0leases). Forward multiples use the current EV of ~US$28.0bn. 2023 net income includes a <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1901\">US$905m<\/a> valuation-allowance release.<\/em><\/p>"}]},{"id":"a-laymans-guide-what-coupang-does-and-how-it-makes-money","num":"2","title":"A layman\u2019s guide: what Coupang does and how it makes money","blocks":[{"t":"c","id":"a-laymans-guide-what-coupang-does-and-how-it-makes-money--1","html":"<p><strong>In one sentence:<\/strong> Coupang is \u201cthe Amazon of South Korea\u201d. It sells almost everything online and delivers it, usually overnight, through its own warehouses and drivers. Most of its loyal customers pay a monthly fee (WOW membership) for free, fast delivery and extras.<\/p><p><strong>How it makes money<\/strong><\/p><ol type=\"1\">\n<li><strong>It buys products and resells them (first-party, \u201c1P\u201d).<\/strong> Coupang buys from brands such as CJ CheilJedang (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003370588-16\">#16<\/a>), stores the goods in its own fulfilment centres, and earns the gap between selling price and cost. This is gross revenue, so it is big revenue at a thin margin (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1745\">#1745<\/a>).<\/li>\n<li><strong>It rents its shop window and warehouses to other merchants (third-party, \u201c3P\u201d, and Fulfilment &amp; Logistics by Coupang, \u201cFLC\u201d).<\/strong> It earns commissions and fulfilment fees. Only the fee is booked as revenue, so revenue is smaller but margins are higher (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1745\">#1745<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-145\">#145<\/a>).<\/li>\n<li><strong>It sells advertising<\/strong> to suppliers and merchants who want to appear higher in search. Much of the supplier ad money reduces cost of goods rather than counting as revenue (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1761\">#1761<\/a>).<\/li>\n<li><strong>It charges a membership fee (WOW).<\/strong> WOW includes free Rocket Delivery and returns, Rocket Fresh grocery, Coupang Eats discounts and Coupang Play streaming (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1755\">#1755<\/a>).<\/li>\n<li><strong>It is incubating new businesses<\/strong> (Developing Offerings): Coupang Eats (food delivery), Coupang Play (video), Coupang Pay (payments), Taiwan (a second Rocket Delivery country), Rocket Now (Japan food delivery) and Farfetch (global luxury marketplace) (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-28\">#28<\/a>).<\/li>\n<\/ol><p><strong>How each division contributes (FY2025)<\/strong><\/p>"},{"t":"table","head":["Division","Revenue","Share of revenue","Adj. EBITDA","What it is"],"rows":[["Product Commerce (Korea)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-50\">US$29.6bn<\/a>","~86% [d]","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-54\">US$2.5bn, 8.4% margin<\/a>","The profit engine: retail, marketplace, Fresh, ads, WOW"],["Developing Offerings","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-55\">US$4.9bn<\/a>","~14% [d]","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-56\">-US$995m<\/a>","The investment arm, led by Taiwan, Eats and Farfetch"],["<strong>Group<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-39\">US$34.5bn<\/a>","100%","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-45\">~US$1.5bn, 4.3%<\/a>","Over 90% of revenue earned in Korea (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1858\">#1858<\/a>)"]]},{"t":"c","id":"a-laymans-guide-what-coupang-does-and-how-it-makes-money--2","html":"<p>So the Korean core earns roughly US$2.5bn of adjusted EBITDA, and about 40% of that is reinvested in the new ventures. Investors are really debating two things: how profitable the Korean core can become, and whether Taiwan will repeat the Korean playbook.<\/p>"}]},{"id":"historical-catalysts-moves-of-more-than-10","num":"3","title":"Historical catalysts: moves of more than 10%","blocks":[{"t":"chart","key":"price","caption":"Coupang share price since IPO with key catalysts (weekly close; ProntoNLP price series \u2021)"},{"t":"table","head":["Date / window","Move \u2021","Driver found in S&P/ProntoNLP documents","Evidence"],"rows":[["IPO, 11-Mar-2021","Priced US$35. Opened US$63.50, closed day 1 US$49.25 (+41%), first week -24% from the open","100m Class A shares at US$35; ~US$3.4bn net proceeds","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177952319-1284\">#1284<\/a>"],["Wk 9-Aug-2021","-12.7%","Q2\u201921 results absorbed the Deokpyeong fulfilment-centre fire (17-Jun-2021): US$158m inventory and US$138m asset write-offs","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002374084-174\">#174<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177952319-1724\">#1724<\/a>"],["Wk 8-Nov-2021","-11.2%","Q3\u201921 adjusted EBITDA loss widened on ~US$95m of COVID labour and operating costs","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002437086-117\">#117<\/a>"],["Jan-2022 (3 weeks)","-38%","No company document in the window. Likely the growth-stock de-rating [u]","n/a"],["28-Feb to 11-Mar-2022","-15.6%, then -17.4%","Q4\u201921: adjusted EBITDA loss widened to US$285m; FY22 guide \u201cbelow US$400m\u201d loss; material weaknesses reiterated","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002514904-128\">#128<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177952319-1671\">#1671<\/a>"],["Apr-May-2022","-63% to US$8.98 low","No company document. Market-driven [u]","n/a"],["12-13 May 2022","+18.5%, +16.4%","Q1\u201922: adjusted EBITDA loss narrowed to US$91M (-1.8% margin); Product Commerce turned adjusted-EBITDA positive","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002563967-92\">#92<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002563967-103\">#103<\/a>"],["Jul-Aug 2022","+67%","Q2\u201922: first positive consolidated adjusted EBITDA; Product Commerce US$98m","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002626640-46\">#46<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002682334-156\">#156<\/a>"],["Wk 7-Nov-2022","+12.2%","Q3\u201922: first positive net income, US$91m","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002682334-80\">#80<\/a>"],["Wk 26-Feb-2024","+15.5%","Q4\u201923: record net income and FCF; Farfetch acquisition closed 30-Jan-2024","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003041770-30\">#30<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2035\">#2035<\/a>"],["Wk 8-Apr-2024","+16.5%","10m-share private buyback from Maverick at US$17.79 the prior week; cause of the 12-Apr jump unverified","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000220937380-0\">#0<\/a>"],["Wk 5-Aug-2024","+11.4%","Q2\u201924: constant-currency revenue +30%; KFTC fine confirmed at US$121m \u201cas expected\u201d","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003215027-36\">#36<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000228616434-1\">#1<\/a>"],["7-May-2025","+10.8% (day)","Q1\u201925: +21% cc revenue; first US$1bn buyback authorised","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003441812-23\">#23<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000259645823-296\">#296<\/a>"],["Wk 8-Sep-2025","+12.1% (to the US$34.08 high)","No company document [u]","n/a"],["Wk 3-Nov-2025","-9.7%","Q3\u201925: Developing Offerings loss of US$292m; FY guide moved to the high end of US$900-950m on Taiwan","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-97\">#97<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-98\">#98<\/a>"],["Wk 15-Dec-2025","-9.5%","8-K on the data incident (up to 33m accounts); Korea CEO resigned 10-Dec; ~US$1.2bn of vouchers","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000253203320-2\">#2<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000253203320-10\">#10<\/a>"],["Jan-Feb 2026","-27%","National Assembly hearings, prosecution referrals, regulator investigations; US class action filed 6-Jan-2026","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-225\">#225<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-415\">#415<\/a>"],["6-May-2026","-13.8% (day)","Q1\u201926: operating loss of US$242m; adjusted EBITDA margin 0.3%; Q2 margin guide -300 to -400bp","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-132\">#132<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-145\">#145<\/a>"],["Wk 8-Jun-2026","+11.0%","PIPC fines of ~US$410m announced (uncertainty removed? [u])","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000261784634-0\">#0<\/a>"],["Wk 13-Jul-2026","-11.6%","Incheon fulfilment-centre fire; ~US$246m of assets and obligations at the site","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-470\">#470<\/a>"],["Wk 5-Oct-2026","+14.8% (five up days)","No company document in the window [u]","n/a"]]},{"t":"c","id":"historical-catalysts-moves-of-more-than-10--1","html":"<p><strong>Read-across.<\/strong> Results have been the dominant driver of the stock\u2019s large moves, especially the profitability inflection (2022) and its reversal (Q1\u201926). Several of the steepest falls (Jan-2022, Apr-May 2022, Sep-Oct 2026) have no company-specific trigger in the filings. That fits a stock that trades as a high-beta growth proxy.<\/p>"}]},{"id":"business-model-key-drivers-customers-suppliers-competitors-and-geographies","num":"4","title":"Business model, key drivers, customers, suppliers, competitors and geographies","blocks":[{"t":"h","level":2,"id":"business-model-in-simple-terms","text":"4.1 Business model in simple terms"},{"t":"c","id":"business-model-key-drivers-customers-suppliers-competitors-and-geographies--1","html":"<p>Coupang runs <strong>an owned, vertically integrated network<\/strong> of more than <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1295\">78m sq ft<\/a> of fulfilment, sortation and delivery space, up from 67m a year earlier (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237408246-1145\">#1145<\/a>). It is staffed largely by direct employees plus \u201ctens of thousands\u201d of independent delivery partners (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-88\">#88<\/a>). Free next-day \u201cRocket Delivery\u201d, launched \u201cover 10 years ago\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-31\">#31<\/a>), is the customer proposition. The economic loop works like this:<\/p><ol type=\"1\">\n<li>Selection, speed and price bring in customers.<\/li>\n<li>Customers raise purchase frequency and spend.<\/li>\n<li>Each cohort\u2019s spend rises year after year (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-69\">#69<\/a>).<\/li>\n<li>Higher volume lowers cost per unit on the fixed network (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-54\">#54<\/a>).<\/li>\n<li>Lower unit cost funds lower prices.<\/li>\n<\/ol><p>The weakness of the model is the flip side of that loop. Much of the cost base is fixed and sized ahead of demand, so a demand shock shows up directly in margins (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-166\">#166<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-58\">#58<\/a>). That is exactly what happened in 2026.<\/p>"},{"t":"h","level":2,"id":"key-business-drivers","text":"4.2 Key business drivers"},{"t":"table","head":["Driver","How it works at Coupang","Current direction"],"rows":[["<strong>Volume<\/strong> (active customers \u00d7 spend per customer)","24.7m active customers in Q2\u201926 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-160\">#160<\/a>); revenue per active customer +5% cc (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-59\">#59<\/a>)","Recovering. Customers are back, but a lower-spending non-returning cohort persists (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-329\">#329<\/a>)"],["<strong>Pricing<\/strong>","1P retail price discipline; WOW fee raised in 2024 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003215027-248\">#248<\/a>); temporary promotions in 2026 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-167\">#167<\/a>)","Promotional intensity elevated through 2026"],["<strong>Mix<\/strong>","3P marketplace and FLC are margin-accretive (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-145\">#145<\/a>); ads are high-margin; Fresh grows above the group (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-148\">#148<\/a>)","Positive structurally"],["<strong>Network utilisation / capex cycle<\/strong>","Capex/revenue: 3.7% (FY21), 4.0%, 3.7%, 2.9%, 3.6% (FY25) [d]; \u201cseveral billion dollars\u201d of future infrastructure and workforce spend (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-138\">#138<\/a>)","Under-utilised in 2026 after the demand shock"],["<strong>Regulation<\/strong>","KFTC (rankings, bundling), PIPC (privacy), labour, settlement periods, night-delivery proposal","Rising headwind"],["<strong>FX (KRW/USD)<\/strong>","Over 90% of revenue in KRW; a 10% adverse move cut 2025 revenue by US$3.0bn and net income by US$173m (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1624\">#1624<\/a>)","Headwind at the KRW\u2019s 15-year low; upside if it mean-reverts"],["<strong>Labour cost<\/strong>","Direct-employment model; Korean labour costs rising under workplace-condition scrutiny (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-915\">#915<\/a>)","Headwind"]]},{"t":"h","level":2,"id":"products-and-services","text":"4.3 Products and services"},{"t":"table","head":["Offering","Description","Evidence"],"rows":[["Rocket Delivery / Dawn / Same-day","Free next-day delivery, order up to midnight; dawn delivery by 7am","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-331\">#331<\/a>"],["Rocket Fresh","Fresh grocery, growing above the group average","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-148\">#148<\/a>"],["Marketplace + FLC (Rocket Growth)","3P selection with Coupang fulfilment; \u201cpath to tens of millions of products\u201d","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-94\">#94<\/a>"],["Advertising","Per click and per impression","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1754\">#1754<\/a>"],["WOW membership","Bundle of delivery, returns, Fresh, Eats and Play benefits","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1755\">#1755<\/a>"],["Coupang Eats / Rocket Now (Japan)","Food and on-demand delivery; \u201cself-sustaining\u201d on a combined basis","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-129\">#129<\/a>"],["Coupang Play","Streaming, including sports","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000259645823-530\">#530<\/a>"],["Coupang Pay","Payments and fintech","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000259645823-526\">#526<\/a>"],["Taiwan","Rocket Delivery replicated; triple-digit growth","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-94\">#94<\/a>"],["Farfetch","Global luxury marketplace (acquired Jan-2024)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1342\">#1342<\/a>"]]},{"t":"h","level":2,"id":"customers-suppliers-competitors","text":"4.4 Customers, suppliers, competitors"},{"t":"c","id":"business-model-key-drivers-customers-suppliers-competitors-and-geographies--2","html":"<ul>\n<li><strong>Customers.<\/strong> Mass-market Korean consumers: 24.7m active customers. WOW membership was 14m at end-2023, the last count disclosed (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-41\">#41<\/a>), and is now above pre-incident levels. No customer concentration exists.<\/li>\n<li><strong>Suppliers.<\/strong> A broad 1P vendor base. The only named supplier verified in the tools is CJ CheilJedang, which reported record \u201cCoupang 1P sales\u201d after resuming supply (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003370588-16\">#16<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003307391-98\">#98<\/a>). Other named suppliers are AWS for cloud (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-695\">#695<\/a>) and Samil PwC as auditor. Large brands (Samsung, LG, P&amp;G and others) are not named for Coupang in the tools [u].<\/li>\n<li><strong>Competitors.<\/strong> Naver (marketplace plus Plus membership, Kurly N Mart, CJ Logistics fulfilment alliance) (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-321\">#321<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-326\">#326<\/a>). AliExpress and Temu entered Korea in earnest in 2024 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-308\">#308<\/a>). Lotte ON (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256750115-92\">#92<\/a>). Shinsegae/Gmarket/SSG, 11st and Kurly [u as named rivals]. In food delivery: Baemin (Delivery Hero, subject to a pending Uber offer (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000263635795-1089\">#1089<\/a>)). In Taiwan: momo.com and others.<\/li>\n<\/ul>"},{"t":"h","level":2,"id":"key-markets-and-geographies","text":"4.5 Key markets and geographies"},{"t":"c","id":"business-model-key-drivers-customers-suppliers-competitors-and-geographies--3","html":"<ul>\n<li>Over 90% of revenue is booked by Korean entities (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1858\">#1858<\/a>). The rest comes mainly from the US, UK (Farfetch), Taiwan, Europe and APAC.<\/li>\n<li>Korean online retail sales were KRW272.0tn in 2025 (+4.9%). Online\u2019s share of retail rose to 41.5%, from 34.6% in 2022 (Statistics Korea, quoted by Naver; <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-305\">#305<\/a>).<\/li>\n<li>The newsletter\u2019s claim of a ~28% Coupang share of Korean e-commerce is <strong>not verifiable<\/strong> in S&amp;P/ProntoNLP [u]. The CEO describes \u201cjust a small share\u201d of the markets Coupang competes in (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-355\">#355<\/a>), and wallet share below US peer levels (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-80\">#80<\/a>).<\/li>\n<\/ul>"},{"t":"h","level":2,"id":"contracts-and-payment-terms-as-disclosed","text":"4.6 Contracts and payment terms (as disclosed)"},{"t":"c","id":"business-model-key-drivers-customers-suppliers-competitors-and-geographies--4","html":"<ul>\n<li><strong>Supplier payments.<\/strong> Accounts payable were 94 days of COGS at FY25 [d], against inventory of 34 days. The cash conversion cycle has been negative for four years: -42, -64, -54 and -57 days for FY22-25 [d].<\/li>\n<li><strong>Payables flatter the true terms.<\/strong> Payables include money collected on behalf of 3P merchants (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1745\">#1745<\/a>), so the true supplier terms are shorter than the reported days.<\/li>\n<li><strong>Supplier finance.<\/strong> US$485m (Dec-25) and US$430m (Mar-26) of confirmed invoices sat in a supplier-finance programme on original terms (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000259645823-366\">#366<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1939\">#1939<\/a>).<\/li>\n<li><strong>Regulatory change from Dec-2026.<\/strong> The EFTA amendment and a proposed Large-Scale Retail Business Act change will shorten merchant settlement periods. Management says this \u201cmay reduce our accounts payable balances and cash on hand\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-619\">#619<\/a>).<\/li>\n<li><strong>Other contracts.<\/strong> WOW is a monthly subscription recognised over time (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1761\">#1761<\/a>). Open purchase orders are generally cancellable (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1507\">#1507<\/a>). No long-term supply contracts are disclosed.<\/li>\n<\/ul>"}]},{"id":"macro-and-micro-factors-tailwinds-and-headwinds","num":"5","title":"Macro and micro factors: tailwinds and headwinds","blocks":[{"t":"table","head":["Factor","Type","Assessment"],"rows":[["Online penetration rising (41.5% of Korean retail)","Macro tailwind","Structural share shift continues (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-305\">#305<\/a>)"],["Coupang wallet share still below US peers","Micro tailwind","Runway for frequency and categories (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-80\">#80<\/a>)"],["Korean consumer weak, inflation and rates","Macro headwind","Risk factor (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-824\">#824<\/a>); management argues experience matters more than macro (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-302\">#302<\/a>)"],["Demographics: ageing, shrinking population","Macro headwind","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-843\">#843<\/a>"],["KRW at a 15-year-plus low","Macro headwind (translation); optionality","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-150\">#150<\/a>"],["Labour costs and safety scrutiny (Serious Accidents Act)","Micro headwind","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-915\">#915<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-869\">#869<\/a>"],["Corporate tax rate +1pt from 2026","Macro headwind","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1413\">#1413<\/a>"],["Chinese cross-border platforms (AliExpress, Temu; >10m users)","Competitive headwind","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-308\">#308<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-344\">#344<\/a>"],["Data-incident trust deficit","Temporary headwind","Lingering trust issues among non-returners (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-478\">#478<\/a>)"],["AI and automation in fulfilment","Micro tailwind","Lower cost to serve (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-90\">#90<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-390\">#390<\/a>)"],["Settlement-period rules (Dec-26); night-delivery proposal","Regulatory headwind","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-619\">#619<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-861\">#861<\/a>"],["Taiwan hyper-growth","Micro tailwind for revenue, headwind for losses","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-94\">#94<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-224\">#224<\/a>"]]},{"t":"c","id":"macro-and-micro-factors-tailwinds-and-headwinds--1","html":"<p><strong>Summary.<\/strong><\/p><ul>\n<li><strong>Tailwinds:<\/strong> structural online penetration; mix shift to 3P, FLC and ads; automation; operating leverage on the fixed network once volumes recover; KRW mean-reversion.<\/li>\n<li><strong>Headwinds:<\/strong> a regulatory overhang that is getting broader, not narrower; labour costs; the Chinese cross-border entrants; a weak Korean consumer; the cost of the Taiwan build-out.<\/li>\n<\/ul>"}]},{"id":"strength-of-products-and-services-competitive-advantages-moats","num":"6","title":"Strength of products and services; competitive advantages (moats)","blocks":[{"t":"h","level":2,"id":"perceived-value-branding-and-marketing-versus-competitors","text":"6.1 Perceived value, branding and marketing versus competitors"},{"t":"c","id":"strength-of-products-and-services-competitive-advantages-moats--1","html":"<ul>\n<li><strong>Value proposition.<\/strong> Management\u2019s description is \u201cthe combination of selection, price and delivery that no one else offers\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-356\">#356<\/a>).\n<ul>\n<li>The WOW bundle is priced at roughly the cost of two deliveries a month, against 14 benefits (Q2\u201924 call, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003215027-261\">#261<\/a>).<\/li>\n<li>The newsletter cites a KRW7,890 monthly fee. The 2024 increase is confirmed (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003215027-248\">#248<\/a>), but the KRW amount is [u].<\/li>\n<\/ul><\/li>\n<li><strong>Revealed preference.<\/strong>\n<ul>\n<li>Each annual customer cohort keeps spending more over time (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-69\">#69<\/a>).<\/li>\n<li>After the incident, nearly 80% of the WOW decline had been recovered by end-April 2026 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-36\">#36<\/a>). Membership has since passed pre-incident levels (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-39\">#39<\/a>).<\/li>\n<\/ul><\/li>\n<li><strong>Brand.<\/strong> The brand is built on delivery reliability rather than advertising. The 2026 marketing step-up is described as a \u201conetime investment to accelerate reacquisition\u201d, to be reduced in 2027 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-420\">#420<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-55\">#55<\/a>). The data incident damaged trust, and \u201csome trust issues remain\u201d among non-returners (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-478\">#478<\/a>).<\/li>\n<li><strong>Competitors\u2019 propositions.<\/strong>\n<ul>\n<li><strong>Naver:<\/strong> marketplace aggregator plus Plus membership (Netflix, Game Pass and Uber benefits; <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000264476510-93\">#93<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003585246-78\">#78<\/a>) and Kurly N Mart dawn delivery (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-321\">#321<\/a>). Logistics are asset-light via CJ Logistics and the NFA alliance (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-326\">#326<\/a>).<\/li>\n<li><strong>Chinese cross-border platforms:<\/strong> compete on price, not speed. Combined users exceed 10m (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-344\">#344<\/a>).<\/li>\n<li>Naver reported gains in commerce GMV and new members after Coupang\u2019s breach (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003646016-298\">#298<\/a>). This is the clearest evidence the moat leaked, at least temporarily.<\/li>\n<\/ul><\/li>\n<\/ul>"},{"t":"h","level":2,"id":"moat-scorecard","text":"6.2 Moat scorecard"},{"t":"table","head":["Category","Rating (1 = none, 5 = very strong)","Assessment and evidence"],"rows":[["<strong>Brand<\/strong>","3 (down from 4)","\u201cRocket\u201d and WOW are synonymous with next-day delivery in Korea. The breach dented trust (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-478\">#478<\/a>), but WOW is at an all-time high (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-271\">#271<\/a>)"],["<strong>Hard assets<\/strong>","5","Over 78m sq ft owned or leased network (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1295\">#1295<\/a>); multi-billion capex over years (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-138\">#138<\/a>); hard and slow to replicate. Naver chose an asset-light alliance instead"],["<strong>Long-term contracts<\/strong>","1","None disclosed with suppliers or customers; POs cancellable (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1507\">#1507<\/a>)"],["<strong>Network effects<\/strong>","3","Two-sided marketplace plus FLC and ads: more buyers bring more 3P selection, and more selection brings more buyers (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-94\">#94<\/a>). Weaker than a pure platform because 1P dominates revenue"],["<strong>Regulatory protection / switching costs<\/strong>","2","No regulatory protection; regulation is a net negative. Switching costs are behavioural (WOW bundle, habit): returners did not split wallet (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-268\">#268<\/a>). But consumers multi-home easily, and the KFTC may unbundle Eats from WOW (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2009\">#2009<\/a>)"],["<strong>Oligopolistic / monopolistic industry<\/strong>","2","Korean e-commerce is competitive: Naver, Chinese entrants, Lotte, Shinsegae and others. Coupang claims \u201ca small share\u201d of retail (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-355\">#355<\/a>); share of the top few platforms \u201cgradually increasing\u201d (Naver, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-310\">#310<\/a>)"],["<strong>Cash-flow predictability<\/strong>","2","FCF: US$1.76bn (FY23), US$1.01bn (FY24), US$0.52bn (FY25), ~US$0.10bn LTM [d]. Highly sensitive to working capital and capex"],["<strong>Scalability<\/strong>","4","Fixed-cost network gives strong operating leverage on volume (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-54\">#54<\/a>); FLC and ads are margin-accretive (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-145\">#145<\/a>). The same leverage works in reverse (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-58\">#58<\/a>)"],["<strong>Risk / history of government interference<\/strong>","1 (high risk)","KFTC US$121m fine and criminal case (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1064\">#1064<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-440\">#440<\/a>); PIPC ~US$410m (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000261784634-8\">#8<\/a>); NTS ~US$208m claim (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-345\">#345<\/a>); National Assembly and prosecution referrals (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-225\">#225<\/a>); night-delivery ban push (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-861\">#861<\/a>); business-group designation (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1007\">#1007<\/a>)"],["<strong>Bargaining power over stakeholders<\/strong>","4 vs suppliers; 2 vs regulators and labour","Scale buyer: CJ CheilJedang returned to record 1P sales after a supply pause (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003307391-98\">#98<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003370588-16\">#16<\/a>); supplier ad payments reduce COGS (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1761\">#1761<\/a>). Labour costs are rising (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-915\">#915<\/a>) and the regulator is assertive"]]},{"t":"c","id":"strength-of-products-and-services-competitive-advantages-moats--2","html":"<p><strong>Moat verdict.<\/strong> The moat is narrow but real. It rests on the physical network, the habit and bundle economics, and supplier scale. It does not rest on regulation, contracts or market structure. The incident showed the moat can leak (Naver GMV gains) but not drain (customers returned with full wallets). The biggest threats to the moat are regulatory rather than competitive: forced Eats unbundling, a night-delivery ban, and settlement-period rules.<\/p>"}]},{"id":"supply-chain-map-from-upstream-inputs-to-the-end-customer","num":"7","title":"Supply chain map: from upstream inputs to the end customer","blocks":[{"t":"chart","key":"supplychain","caption":"Coupang value chain with named stakeholders (\u2713 = cited in S&P/ProntoNLP; [u] = not named in tools)"},{"t":"c","id":"supply-chain-map-from-upstream-inputs-to-the-end-customer--1","html":"<p><strong>Where Coupang sits.<\/strong> Coupang is unusually vertically integrated for a retailer. It spans procurement (1P buying and private label via CPLB, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-74\">#74<\/a>), warehousing and fulfilment (own network, including fulfilment for 3P sellers), last-mile delivery (direct-employment drivers plus independent partners, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-88\">#88<\/a>), the consumer interface (app, WOW), and payments (Coupang Pay).<\/p><p><strong>Key external dependencies:<\/strong><\/p><ul>\n<li>AWS cloud: \u201cwe cannot quickly or easily switch\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-696\">#696<\/a>).<\/li>\n<li>Korean banks for working-capital lines and supplier finance.<\/li>\n<li>Landlords: US$3.0bn of lease liabilities and US$689m of signed leases not yet commenced (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1931\">#1931<\/a>).<\/li>\n<li>Card networks: competitors \u201ccontrol\u2026 credit card interchange\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-368\">#368<\/a>).<\/li>\n<\/ul><p><strong>Named counterparties verified in the tools.<\/strong> CJ CheilJedang (supplier), Amazon Web Services (cloud), Mandiant and Palo Alto Networks (incident forensics, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-36\">#36<\/a>), Samil PwC (auditor), Greenoaks (co-investor in Farfetch and a related party, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2050\">#2050<\/a>), and Farfetch boutiques and brands. Brand names such as Samsung, LG, Nongshim, Amorepacific, P&amp;G and Unilever, and carriers such as CJ Logistics and Hanjin, are commonly cited as part of Korea\u2019s e-commerce supply chain. <strong>None is named for Coupang in S&amp;P/ProntoNLP [u].<\/strong><\/p>"}]},{"id":"financial-performance-by-division-and-geography-fy2021-fy2025","num":"8","title":"Financial performance by division and geography (FY2021-FY2025)","blocks":[{"t":"h","level":2,"id":"consolidated-pl-sp-capital-iq-usm","text":"8.1 Consolidated P&L (S&P Capital IQ, US$m)"},{"t":"table","head":["","FY2021","FY2022","FY2023","FY2024","FY2025","LTM Jun-26"],"rows":[["Revenue","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=218853463&amp;uctSearch=18406.000000\">18,406<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=237408246&amp;uctSearch=20583.000000\">20,583<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=24383.000000\">24,383<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=30268.000000\">30,268<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=34534.000000\">34,534<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057\">35,462<\/a>"],["Growth (reported / cc)","+54% [d] / n.a.","+11.8% / <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000200362169-24\">+26%<\/a>","+18.5% / <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-27\">+20%<\/a>","+24.1% / <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237406755-35\">+29%<\/a>","+14.1% / <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-39\">+18%<\/a>","+9.9% [d]"],["Gross profit","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=218853463&amp;uctSearch=3109.000000\">3,109<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=237408246&amp;uctSearch=4710.000000\">4,710<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=6190.000000\">6,190<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=8715.000000\">8,715<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=10141.000000\">10,141<\/a>","10,055 [d]"],["Gross margin","16.9%","22.9%","25.4%","28.8%","29.4%","28.4%"],["EBITDA (S&P, reported)","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=218853463&amp;uctSearch=-997.000000\">-997<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=237408246&amp;uctSearch=119.000000\">119<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=748.000000\">748<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=821.000000\">821<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=1015.000000\">1,015<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057\">-46<\/a>"],["Adj. EBITDA (company)","n.a. (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177872792-28\">Q4\u201921: -285<\/a>)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000200362169-27\">381<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-32\">~1,100 (4.4%)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237406755-44\">~1,400 (4.5%)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-45\">~1,500 (4.3%)<\/a>","872 [d] (2.5%)"],["Operating income (EBIT)","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=218853463&amp;uctSearch=-1198.000000\">-1,198<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=237408246&amp;uctSearch=-112.000000\">-112<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=473.000000\">473<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=388.000000\">388<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=498.000000\">498<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057\">-603<\/a>"],["EBIT margin","-6.5%","-0.5%","1.9%","1.3%","1.4%","-1.7%"],["Net income to CPNG","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=218853463&amp;uctSearch=-1543.000000\">-1,543<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=237408246&amp;uctSearch=-92.000000\">-92<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=1360.000000\">1,360<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=154.000000\">154<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=208.000000\">208<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057\">-767<\/a>"],["Net margin","-8.4%","-0.4%","5.6%","0.5%","0.6%","-2.2%"]]},{"t":"c","id":"financial-performance-by-division-and-geography-fy2021-fy2025--1","html":"<p><em>S&amp;P EBITDA = EBIT + D&amp;A. Company adjusted EBITDA also adds back stock-based compensation and excludes certain items (2026: \u201cadministrative fines\u201d, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-339\">#339<\/a>). The S&amp;P FY2025 operating income of US$498m differs from the company\u2019s US$473m (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-42\">#42<\/a>) because S&amp;P reclassifies US$25m of restructuring below EBIT. LTM gross profit is the sum of the last four quarters \u2021.<\/em><\/p>"},{"t":"chart","key":"annual","caption":"Annual revenue, gross margin and EBITDA/EBIT margins"},{"t":"h","level":2,"id":"by-division-segments-company-disclosures-via-prontonlp","text":"8.2 By division (segments; company disclosures via ProntoNLP)"},{"t":"table","head":["US$m","FY2021","FY2022","FY2023","FY2024","FY2025"],"rows":[["<strong>Product Commerce revenue<\/strong>","n.d. (segments introduced 2022, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177872792-38\">#38<\/a>)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000200362169-28\">20,000 (+12%; +26% cc)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-34\">23,600 (+18%; +19% cc)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237406755-49\">26,700 (+13%; +18% cc)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-50\">29,600 (+11%; +16% cc)<\/a>"],["PC adj. EBITDA (margin)","n.d. (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177872792-43\">Q4\u201921 margin -2.6%<\/a>)","~600 [d] (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000200362169-29\">3.0%<\/a>)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-35\">1,500 (6.5%)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237406755-50\">2,000 (7.5%)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-54\">2,500 (8.4%)<\/a>"],["<strong>Developing Offerings revenue<\/strong>","n.d.","~580 [d]","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-37\">789<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237406755-51\">3,600 (+352%, Farfetch)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-55\">4,900 (+38%; +40% cc)<\/a>"],["DO adj. EBITDA","n.d.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-38\">-225<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-38\">-466<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237406755-53\">-631<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-56\">-995<\/a>"],["<strong>Segment EBIT / net income<\/strong>","Not disclosed. The chief operating decision maker (CODM) measure is segment adjusted EBITDA only; no segment D&A, EBIT or net income is reported (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1868\">#1868<\/a>)","","","",""]]},{"t":"chart","key":"segments","caption":"Segment revenue and adjusted EBITDA"},{"t":"c","id":"financial-performance-by-division-and-geography-fy2021-fy2025--2","html":"<p><strong>Quarterly segment trend (last four quarters)<\/strong><\/p>"},{"t":"table","head":["","Q3\u201925","Q4\u201925","Q1\u201926","Q2\u201926"],"rows":[["PC revenue (reported / cc growth)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-72\">US$8.0bn, +16% / +18%<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-131\">US$7.4bn, +8% / +12%<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-90\">US$7.2bn, +4% / +5%<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-158\">US$7.4bn, +1% / +8%<\/a>"],["PC gross margin","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-81\">32.1%<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-147\">31.9%<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-100\">30.3%<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-165\">30.5%<\/a>"],["PC adj. EBITDA (margin)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-86\">US$705m (8.8%)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-151\">US$567m (7.7%)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-106\">US$358m (5.0%)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-169\">US$382m (5.1%)<\/a>"],["DO revenue (reported / cc)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-92\">US$1.3bn, +32% / +31%<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-155\">US$1.4bn, +32% / +31%<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-111\">US$1.3bn, +28% / +25%<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-175\">US$1.4bn, +20% / +24%<\/a>"],["DO adj. EBITDA","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-97\">-US$292m<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-161\">-US$300m<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-115\">-US$329m<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-179\">-US$219m<\/a>"],["Consolidated adj. EBITDA (margin)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-122\">US$413m (4.5%)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-183\">US$267m (3.0%)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-134\">US$29m (0.3%)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-201\">US$163m (1.8%)<\/a>"],["GAAP operating income","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=259645823&amp;uctSearch=162.000000\">162<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354\">8<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=259645823&amp;uctSearch=-242.000000\">-242<\/a>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057&amp;uctSearch=-556.000000\">-556<\/a>"]]},{"t":"chart","key":"margins","caption":"Margin reset after the data incident"},{"t":"h","level":2,"id":"by-geography","text":"8.3 By geography"},{"t":"c","id":"financial-performance-by-division-and-geography-fy2021-fy2025--3","html":"<p>Coupang does not publish a geographic P&amp;L in prose that ProntoNLP indexes; the geographic table is not retrievable. The disclosed facts:<\/p><ul>\n<li>Over 90% of net revenue is earned by Korean entities (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1858\">#1858<\/a>). The remainder comes from the US, UK, Taiwan, Europe and APAC (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1859\">#1859<\/a>).<\/li>\n<li>Product Commerce is entirely Korean.<\/li>\n<li>Taiwan sits in Developing Offerings and is growing at triple-digit rates (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-94\">#94<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-98\">#98<\/a>). It is \u201cthe largest contributor\u201d to Developing Offerings losses (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-224\">#224<\/a>).<\/li>\n<li>Farfetch\u2019s revenue is global. It was 5% of FY24 revenue and 7% of assets (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237408246-1525\">#1525<\/a>).<\/li>\n<\/ul><p>Geographic EBITDA, EBIT and net income are <strong>not disclosed<\/strong> \u2021.<\/p>"},{"t":"h","level":2,"id":"trends-growth-and-margins-and-why","text":"8.4 Trends: growth and margins, and why"},{"t":"c","id":"financial-performance-by-division-and-geography-fy2021-fy2025--4","html":"<ol type=\"1\">\n<li><strong>Growth decelerated from hyper-growth to mid-teens before the incident.<\/strong> Revenue compounded at ~17% a year over FY21-25 [d], with constant-currency growth above reported growth in every year.\n<ul>\n<li>FY2023 reported growth was depressed by ~520bp when FLC revenue moved to a net basis (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-28\">#28<\/a>).<\/li>\n<li>FY2024 was boosted by Farfetch; growth ex-Farfetch was 17% against 24% reported (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237406755-36\">#36<\/a>).<\/li>\n<li>The 2025 USD figures absorbed a 5pt FX drag on Product Commerce (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1389\">#1389<\/a>).<\/li>\n<\/ul><\/li>\n<li><strong>Gross margin expanded by 12.5pts in four years<\/strong> (16.9% to 29.4%). The drivers were mix (3P/FLC and ads), procurement scale and automation, and Farfetch\u2019s higher-margin marketplace model. The incident reversed about 1-2pts in H1\u201926 through vouchers, promotions and supply-chain inefficiency (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-102\">#102<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-167\">#167<\/a>).<\/li>\n<li><strong>Product Commerce profitability is the real story.<\/strong> PC adjusted EBITDA margin climbed from ~3% (FY22) to 8.4% (FY25), and 8.8% in Q3\u201925. Developing Offerings losses grew from US$225m to US$995m over the same years, consuming about 40% of PC EBITDA in FY25.<\/li>\n<li><strong>The GAAP bottom line is noisy.<\/strong> Items include a US$905m valuation-allowance release in FY23 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1901\">#1901<\/a>) and a US$175m fire-insurance gain and US$121m KFTC fine in FY24 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1360\">#1360<\/a>). Effective tax rates were 86% in FY24 and 64% in FY25 [d], because losses in Taiwan, the US and Farfetch get no tax benefit (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1413\">#1413<\/a>).<\/li>\n<li><strong>2026 broke the margin trajectory.<\/strong> Revenue held up, at +8% to +10% constant currency. But fixed costs sized for pre-incident demand, extra marketing and vouchers cut the PC margin to ~5% (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-170\">#170<\/a>).<\/li>\n<\/ol>"},{"t":"h","level":2,"id":"operational-kpis-and-recent-trends","text":"8.5 Operational KPIs and recent trends"},{"t":"table","head":["KPI","History","Latest","Trend / comment"],"rows":[["Active customers (PC, m)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002514904-108\">~18 (FY21)<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-25\">&gt;21 (FY23)<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237406755-27\">22.8 (FY24)<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-27\">24.6 (FY25)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-92\">23.9 (Q1\u201926)<\/a> \u2192 <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-160\">24.7 (Q2\u201926)<\/a>","Recovered. The trailing three-month definition lagged the dip (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-93\">#93<\/a>)"],["Revenue per active customer (cc)","+3% to +7% a quarter in 2025 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1386\">#1386<\/a>)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-59\">+5% (Q2\u201926)<\/a>","Stable"],["WOW paid members (m)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002514904-63\">6 (2020), ~9 (2021)<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000200362169-32\">11 (2022)<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-41\">14 (2023)<\/a>","Above pre-incident; all-time high (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-271\">#271<\/a>)","No count since 2023 [u]"],["PC gross margin","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-51\">32.0% (FY25)<\/a>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-165\">30.5% (Q2\u201926)<\/a>","-210bp YoY"],["PC adj. EBITDA margin","3.0% \u2192 6.5% \u2192 7.5% \u2192 8.4% (FY22-25)","5.1% (Q2\u201926)","Target: pre-incident by mid-2027 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-220\">#220<\/a>)"],["DO adj. EBITDA loss","-225 \u2192 -466 \u2192 -631 \u2192 -995 (FY22-25)","-219 (Q2\u201926)","FY26 guide -950 to -1,000 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-223\">#223<\/a>)"],["Fulfilment footprint",">67m sq ft (FY24, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237408246-1145\">#1145<\/a>)",">78m sq ft (FY25, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1295\">#1295<\/a>)","+16%"],["Capex intensity (capex / revenue)","3.7%, 4.0%, 3.7%, 2.9%, 3.6% (FY21-25) [d]","3.7% LTM [d]","Re-accelerating; \u201cseveral billion\u201d ahead"],["Cash conversion cycle (days)","-42, -64, -54, -57 (FY22-25) [d]","n.a.","Negative working capital at risk from settlement rules (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-619\">#619<\/a>)"],["Free cash flow (US$m)","-1,085, -259, 1,756, 1,007, 522 (FY21-25) [d]","~99 LTM [d]","Collapsing"],["SBC (% of revenue)","1.3%-1.4% (FY22-25) [d]","1.8% (Q2\u201926) [d]","Rising"],["Backlog / installed base / churn","Not applicable / not disclosed","WOW churn elevated in Dec-25, then normalised (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-139\">#139<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-140\">#140<\/a>)",""]]}]},{"id":"earnings-calls-what-management-is-focused-on-and-how-sentiment-has-shifted","num":"9","title":"Earnings calls: what management is focused on, and how sentiment has shifted","blocks":[{"t":"h","level":2,"id":"summary-of-the-last-four-calls","text":"9.1 Summary of the last four calls"},{"t":"c","id":"earnings-calls-what-management-is-focused-on-and-how-sentiment-has-shifted--1","html":"<ul>\n<li><strong><a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003578475\">Q3\u201925, 4-Nov-2025<\/a>, before the incident.<\/strong> Confident and growth-led: \u201cgrowth and expanding margins yet again\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-22\">#22<\/a>).\n<ul>\n<li>Product Commerce margin 8.8%. Consolidated margins expanding annually \u201cfor the foreseeable future\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-126\">#126<\/a>). PC margins to move \u201cwell past the 10%\u201d level (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-271\">#271<\/a>).<\/li>\n<li>The worry was Developing Offerings losses: guided to the high end of US$900-950m on Taiwan (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-98\">#98<\/a>).<\/li>\n<\/ul><\/li>\n<li><strong><a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003665452\">Q4\u201925, 26-Feb-2026<\/a>.<\/strong> Opened with an apology (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-26\">#26<\/a>) and an incident review by the General Counsel (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-35\">#35<\/a>). Palo Alto Networks called it a targeted insider attack, not a systemic failure (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-53\">#53<\/a>).\n<ul>\n<li>Guidance: margin expansion \u201cdisrupted\u201d in 2026 but not structurally (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-199\">#199<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-200\">#200<\/a>). Developing Offerings loss guided at US$950m-1bn (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-202\">#202<\/a>). No full-year revenue guide (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-197\">#197<\/a>).<\/li>\n<\/ul><\/li>\n<li><strong><a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003711263\">Q1\u201926, 5-May-2026<\/a>.<\/strong> The recovery case: active customers dipped 3% QoQ on a lagged definition, but nearly 80% of the lost WOW members were back by April (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-36\">#36<\/a>).\n<ul>\n<li>Management explained the fixed-cost structure and chose not to cut capacity (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-186\">#186<\/a>).<\/li>\n<li>Q2 margin guided -300 to -400bp; annual expansion to resume in 2027 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-147\">#147<\/a>). A further US$1bn buyback was authorised.<\/li>\n<\/ul><\/li>\n<li><strong><a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003779883\">Q2\u201926, 4-Aug-2026<\/a>.<\/strong> More confident on customers: WOW above pre-incident levels, and underlying spend +16% (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-43\">#43<\/a>).\n<ul>\n<li>The margin recovery date slipped to \u201cmid-2027\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-220\">#220<\/a>). \u201cNothing has structurally changed\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-252\">#252<\/a>). Marketing to step down in 2027 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-55\">#55<\/a>).<\/li>\n<li>Focus areas: cohort economics, Taiwan\u2019s playbook, and AI across operations (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-390\">#390<\/a>).<\/li>\n<\/ul><\/li>\n<\/ul><p><strong>Where management\u2019s attention has moved.<\/strong> Before the incident it was selection, FLC, automation and Taiwan. After it, the focus is customer retention and trust, the fixed-cost and margin bridge, the regulatory and legal process, and capital return.<\/p>"},{"t":"h","level":2,"id":"sentiment-analysis-prontonlp","text":"9.2 Sentiment analysis (ProntoNLP)"},{"t":"table","head":["Call","ProntoNLP document sentiment (-1 to +1)","Positive events","Negative events","Net polarity [d]","Tone"],"rows":[["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003041770\">Q4\u201923<\/a>","0.85","211","15","0.87","Upbeat"],["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003113152\">Q1\u201924<\/a>","0.87","187","10","0.90","Upbeat"],["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003215027\">Q2\u201924<\/a>","0.80","175","20","0.79","Upbeat"],["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003299355\">Q3\u201924<\/a>","0.81","<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003299355_$GROUPBY_PatternSentiment\">164<\/a>","17","0.81","Upbeat"],["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003384178\">Q4\u201924<\/a>","0.83","<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003384178_$GROUPBY_PatternSentiment\">249<\/a>","24","0.82","Upbeat"],["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003441812\">Q1\u201925<\/a>","0.85","189","13","0.87","Upbeat"],["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003515732\">Q2\u201925<\/a>","0.86","210","14","0.88","Upbeat"],["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003578475\">Q3\u201925<\/a>","0.81","<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003578475_$GROUPBY_PatternSentiment\">207<\/a>","22","0.81","Confident"],["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003665452\">Q4\u201925<\/a>","<strong>0.42<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003665452_$GROUPBY_PatternSentiment\">193<\/a>","64","0.50","Apologetic, defensive"],["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003711263\">Q1\u201926<\/a>","<strong>0.34<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003711263_$GROUPBY_PatternSentiment\">166<\/a>","71","0.40","Trough; recovery narrative"],["<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003779883\">Q2\u201926<\/a>","<strong>0.53<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003779883_$GROUPBY_PatternSentiment\">254<\/a>","64","0.60","Recovering, but date pushed out"]]},{"t":"chart","key":"sentiment","caption":"ProntoNLP sentiment per call"},{"t":"c","id":"earnings-calls-what-management-is-focused-on-and-how-sentiment-has-shifted--2","html":"<p><strong>Reading the signal<\/strong><\/p><ul>\n<li>Sentiment held at ~0.80-0.87 for eight straight calls, collapsed to 0.42 and 0.34 after the incident, and has recovered only partially, to 0.53.<\/li>\n<li>On the Q2\u201926 call the main negative event types are <a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003779883_$GROUPBY_EventTypes_$KEY_OperationalChallenge\">OperationalChallenge<\/a> (12 negative mentions) and <a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003779883_$GROUPBY_EventTypes_$KEY_FinancialChallenge\">FinancialChallenge<\/a>. <a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003779883_$GROUPBY_EventTypes_$KEY_CustomerRetention\">CustomerRetention<\/a> has become a top <em>positive<\/em> theme (20 positive, 3 negative).<\/li>\n<li>The \u201cCurrentState\u201d aspect score rebounded from 0.17 (Q1\u201926) to 0.35 (Q2\u201926) (<a href=\"https://gam.prontonlp.com/#/ref/$DOCID_T000003779883_$GROUPBY_Aspects_$KEY_CurrentState\">CurrentState<\/a>), against 0.70 before the incident.<\/li>\n<\/ul><p>The trajectory supports the \u201cglitch\u201d view of demand and a \u201cnot yet\u201d view of profitability.<\/p>"}]},{"id":"latest-result-q226-reported-4-aug-2026","num":"10","title":"Latest result (Q2\u201926, reported 4-Aug-2026)","blocks":[{"t":"table","head":["Metric","Actual","Consensus (ProntoNLP) \u2021","Surprise"],"rows":[["Revenue","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057&amp;uctSearch=8856.000000\">US$8,856m<\/a>","US$8,922m","<strong>-0.7% (miss)<\/strong>"],["Adj. EBITDA","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-201\">US$163m (1.8%)<\/a>","US$7m","Beat (consensus dispersion likely included fines in some estimates)"],["Net income","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-199\">-US$570m<\/a> (-US$160m ex-fines, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-200\">#200<\/a>)","-US$377m","Miss (fines)"],["Diluted EPS","-US$0.32 (-US$0.09 ex-fines)","-US$0.27","Miss by US$0.05 on GAAP; beat ex-fines"]]},{"t":"c","id":"latest-result-q226-reported-4-aug-2026--1","html":"<p><em>Consensus history: revenue missed in four of the last six quarters (1Q25, 4Q25, 1Q26 and 2Q26); GAAP EPS missed in four of the last six. Consensus values come from ProntoNLP getCompanyConsensus, which returns no source links \u2021.<\/em><\/p><p><strong>Segment drivers<\/strong><\/p><ul>\n<li><strong>Product Commerce:<\/strong> +8% constant currency, accelerating from +5% in Q1 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-159\">#159<\/a>), but only +1% in USD because of the 7pt FX hit (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-60\">#60<\/a>).<\/li>\n<li><strong>Developing Offerings:<\/strong> +24% constant currency, led by Taiwan, Eats and Farfetch (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-176\">#176<\/a>). The DO loss narrowed by US$110m QoQ (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-179\">#179<\/a>). This is the notable acceleration of the quarter.<\/li>\n<\/ul><p><strong>Margins<\/strong><\/p><ul>\n<li>Consolidated gross margin was 28.2%: -188bp YoY but +115bp QoQ (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-183\">#183<\/a>).<\/li>\n<li>PC gross margin was 30.5% (-210bp) on supply-chain dislocation and temporary promotions (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-167\">#167<\/a>).<\/li>\n<li>PC adjusted EBITDA margin was 5.1% (-390bp) because fixed costs are sized for pre-incident demand (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-170\">#170<\/a>).<\/li>\n<li>OG&amp;A was 34.4% of revenue reported and 29.8% ex-fines, +150bp YoY on marketing and Developing Offerings (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-187\">#187<\/a>).<\/li>\n<\/ul><p><strong>Guidance and tone<\/strong><\/p><ul>\n<li><strong>Q3\u201926:<\/strong> +8-9% constant-currency revenue; Chuseok timing is a headwind (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-213\">#213<\/a>). Adjusted EBITDA margin -300 to -400bp YoY.<\/li>\n<li><strong>Recovery path:<\/strong> PC margin back to pre-incident levels by mid-2027 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-220\">#220<\/a>); 2027 guidance by year-end (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-221\">#221<\/a>).<\/li>\n<li><strong>Developing Offerings:<\/strong> loss guide of US$950m-1bn reiterated (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-223\">#223<\/a>).<\/li>\n<li><strong>Tone:<\/strong> firmer on demand, but this is a second deferral of margin normalisation.<\/li>\n<li><strong>Analysts on the call:<\/strong> Stanley Yang (JPMorgan) asked whether margins return in 2027; management said yes, by mid-2027 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-247\">#247<\/a>). Eric Cha (Goldman Sachs) asked about the gap between 16% underlying and 8% reported growth; management attributed it mostly to lower-spending non-returners (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-329\">#329<\/a>). Jiong Shao (Barclays) probed the implied ~6-7% PC growth in Q3 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-432\">#432<\/a>).<\/li>\n<\/ul><p><strong>Balance-sheet flags<\/strong><\/p><ul>\n<li>The US$410m of fines is accrued but unpaid; accrued expenses rose from <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=259645823&amp;uctSearch=406.000000\">US$406m<\/a> to <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057&amp;uctSearch=876.000000\">US$876m<\/a>.<\/li>\n<li>US$750m is drawn on the revolver (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-165\">#165<\/a>); short-term borrowings are <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057&amp;uctSearch=1985.000000\">US$1,985m<\/a>, against <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354\">US$960m<\/a> at YE25.<\/li>\n<li>Equity fell to ~US$3.0bn from US$4.6bn at YE25 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-130\">#130<\/a>).<\/li>\n<li>Inventory fell and payables rose (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-142\">#142<\/a>), so working capital helped CFO.<\/li>\n<li>TTM FCF was only US$105m (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-206\">#206<\/a>) while US$459m of stock was repurchased.<\/li>\n<li>New items: the NTS transfer-pricing claim of ~US$208m (unreserved, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-345\">#345<\/a>) and the Incheon fire (~US$246m exposure, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-470\">#470<\/a>).<\/li>\n<\/ul><p><strong>Market reaction.<\/strong> The stock fell 4.6% the next day (US$16.78 to US$16.00 \u2021) and recovered 2.2% the day after. Compare -13.8% after Q1. The muted reaction to a large GAAP loss says the fines and the margin trough were priced. What the market did not reward was the slip in the recovery date.<\/p><p><strong>Unusual relative to history<\/strong><\/p><ol type=\"1\">\n<li>The first consecutive GAAP operating losses since 2022.<\/li>\n<li>The first \u201cadministrative fines\u201d reconciling item in adjusted EBITDA.<\/li>\n<li>Tax expense on a pre-tax loss.<\/li>\n<li>SBC jumped to <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057\">US$161m<\/a> from US$113m a year earlier.<\/li>\n<li>Buybacks funded alongside revolver drawings.<\/li>\n<\/ol>"}]},{"id":"eps-estimates-fy2026e-fy2028e","num":"11","title":"EPS estimates, FY2026E-FY2028E","blocks":[{"t":"c","id":"eps-estimates-fy2026e-fy2028e--1","html":"<p><strong>Approach.<\/strong> We build from segments:<\/p><ul>\n<li><strong>Revenue:<\/strong> Product Commerce and Developing Offerings growth in constant currency, translated at an assumed persistent KRW-weakness drag in H2\u201926 and flat FX thereafter.<\/li>\n<li><strong>Margins:<\/strong> Product Commerce margin recovery and Developing Offerings loss reduction.<\/li>\n<li><strong>Below EBITDA:<\/strong> D&amp;A rising with capex; SBC; one-off items (fines, fire, insurance); net interest; an effective tax rate falling as Taiwan and Farfetch losses shrink; buybacks against SBC dilution.<\/li>\n<\/ul>"},{"t":"table","head":["US$m (base case)","FY2025A","FY2026E","FY2027E","FY2028E"],"rows":[["Product Commerce revenue","29,600","30,712","34,090","37,499"],["Developing Offerings revenue","4,934","5,974","7,049","8,318"],["<strong>Total revenue<\/strong>","<strong>34,534<\/strong>","<strong>36,686<\/strong>","<strong>41,139<\/strong>","<strong>45,817<\/strong>"],["Growth (USD)","+14.1%","+6.2%","+12.1%","+11.4%"],["PC adj. EBITDA margin","8.4%","5.2% [d]","7.3%","8.6%"],["DO adj. EBITDA","-995","~-975 (guide midpoint)","-800","-600"],["<strong>Adj. EBITDA<\/strong>","~1,485","608","1,689","2,625"],["Adj. EBITDA margin","4.3%","1.7%","4.1%","5.7%"],["D&A","517","593","680","780"],["SBC","475","563","580","620"],["One-offs (fines, fire, insurance)","-25","-560 (fines -410, fire -150 [e])","+100 (insurance [e])","0"],["<strong>GAAP EBIT<\/strong>","473","-1,117","529","1,225"],["Net interest and other","124","30","40","30"],["Pre-tax income","597","-1,087","569","1,255"],["Tax (ETR)","383 (64%)","108 (n.m.)","313 (55%)","502 (40%)"],["<strong>Net income to CPNG<\/strong>","208","-1,195","256","753"],["Diluted shares (m)","1,855","1,796","1,790","1,795"],["<strong>GAAP diluted EPS (US$)<\/strong>","<strong>0.11<\/strong>","<strong>-0.67<\/strong>","<strong>0.14<\/strong>","<strong>0.42<\/strong>"],["Adj. EPS ex one-offs (US$)","~0.12","-0.37","0.10","0.42"]]},{"t":"chart","key":"bridge","caption":""},{"t":"c","id":"eps-estimates-fy2026e-fy2028e--2","html":"<p><strong>Key assumptions and their logic<\/strong><\/p><ul>\n<li><strong>H2\u201926 revenue.<\/strong> Q3: PC +6.5% constant currency (in line with the Barclays-implied 6-7%) less 5pts of FX; DO +20% reported. Q4: an easy December-25 comparison, so PC +12% constant currency less 4pts of FX. That gives US$9.64bn and US$9.69bn.<\/li>\n<li><strong>H2\u201926 margins.<\/strong> Q3 adjusted EBITDA margin of 1.2% (the -330bp end of the guide); Q4 3.1%.<\/li>\n<li><strong>Industry growth and share.<\/strong> Korean online sales grew +4.9% in 20
