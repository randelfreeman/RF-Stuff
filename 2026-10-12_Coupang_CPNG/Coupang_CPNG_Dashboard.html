25 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-305\">#305<\/a>). We assume Coupang grows PC at 11% and 10% in FY27 and FY28. That is roughly 2x the market, consistent with past share gains, and reflects recapture of the non-returning cohort and lapping of the vouchers.<\/li>\n<li><strong>Pricing and cost pressures.<\/strong> Promotions normalise in 2027 and marketing steps down (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-55\">#55<\/a>). Labour cost inflation and the night-delivery risk are not in the base case.<\/li>\n<li><strong>Operating leverage.<\/strong> We take PC margin to 7.3% in FY27, the mid-2027 recovery path, and 8.6% in FY28, roughly the pre-incident level. This is below the \u201cwell past 10%\u201d ambition (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-271\">#271<\/a>).<\/li>\n<li><strong>Financing costs.<\/strong> ~US$2.6bn of debt at ~3-4% (Korean lines at 2.89% (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-173\">#173<\/a>), term loan at 3.80%, revolver at SOFR+0.75-1.25%) against ~US$5.5-6bn of cash.<\/li>\n<li><strong>Share count.<\/strong> US$907m of remaining authorisation absorbs SBC dilution; 386m shares remain available under the equity plans (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1886\">#1886<\/a>).<\/li>\n<li><strong>Tax.<\/strong> ETR stays well above the ~25% long-term guide (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-120\">#120<\/a>) while Taiwan and US losses get no benefit.<\/li>\n<\/ul><p><strong>Versus consensus.<\/strong> ProntoNLP\u2019s consensus for 3Q26 and 4Q26 is stale: EPS of US$0.17 and US$0.20 dated March 2025 \u2021. No current FY2027 or FY2028 consensus is available from S&amp;P or ProntoNLP, so we cannot quantify the gap to street estimates.<\/p><p><strong>Sensitivities [d]<\/strong><\/p><ul>\n<li>Each 100bp of PC margin is ~US$340-375m of EBITDA, or ~US$0.09-0.11 of EPS at a 45-55% ETR.<\/li>\n<li>A 10% move in the KRW is ~\u00b1US$3.5-4bn of revenue and ~\u00b1US$0.10 of EPS (scaled from the 10-K sensitivity, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1624\">#1624<\/a>).<\/li>\n<li>Each US$100m change in Developing Offerings losses is ~US$0.03-0.05 of EPS.<\/li>\n<\/ul>"}]},{"id":"capital-structure-liquidity-maturities-and-covenants","num":"12","title":"Capital structure, liquidity, maturities and covenants","blocks":[{"t":"table","head":["Instrument","Amount","Pricing","Maturity","Security / covenants","Source"],"rows":[["Revolving credit facility (Parent, USD)","US$1.5bn; <strong>US$750m drawn<\/strong>","Term SOFR + 0.75-1.25%","Five-year from Jun-2025 (~2030 [d])","Unsecured; customary financial covenants","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-371\">#371<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-165\">#165<\/a>"],["Other credit facilities (mainly Korean subsidiaries, KRW)","US$1.6bn capacity; <strong>US$1.2bn drawn<\/strong>","Weighted average 2.89%","Majority within 12 months","Unsecured; financial covenants","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-173\">#173<\/a>"],["New Korean revolvers (Jun-2026)","~US$193m; undrawn","Korean CD rate + 1.20-1.50%","Jun-2027","Unsecured","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-166\">#166<\/a>"],["Unsecured term loan (Sep-2025)","US$439m","Fixed 3.80% (average)","~Sep-2028","Unsecured; refinanced secured FC loans","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1514\">#1514<\/a>"],["Taiwan RCF","Up to US$199m","TAIBOR + 1.25%","~2029","Senior unsecured","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237408246-1862\">#1862<\/a>"],["Operating leases","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057&amp;uctSearch=560.000000\">US$560m<\/a> current + <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057&amp;uctSearch=2470.000000\">US$2,470m<\/a> non-current, plus US$689m signed but not commenced","n.a.","1-10 years","Not applicable","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1931\">#1931<\/a>"],["<strong>Total funded debt<\/strong>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057&amp;uctSearch=1985.000000\">US$1,985m<\/a> short-term + <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057&amp;uctSearch=618.000000\">US$618m<\/a> long-term = US$2,603m [d]","Variable-rate debt US$982m (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-194\">#194<\/a>)","","Covenants in compliance (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-377\">#377<\/a>)",""],["<strong>Cash<\/strong>","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057&amp;uctSearch=6110.000000\">US$6,110m<\/a>, mostly held by foreign subsidiaries (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-129\">#129<\/a>)","","","Upstreaming restricted by subsidiary agreements (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-140\">#140<\/a>)",""]]},{"t":"c","id":"capital-structure-liquidity-maturities-and-covenants--1","html":"<p><strong>Net position (30-Jun-2026) [d]<\/strong><\/p><ul>\n<li>Net cash excluding leases: <strong>US$3.5bn<\/strong>.<\/li>\n<li>Net cash including leases: <strong>US$0.48bn<\/strong>, matching S&amp;P net debt of <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057\">-US$477m<\/a>.<\/li>\n<li>Net debt/EBITDA: n.m. (net cash).<\/li>\n<\/ul><p><strong>Interest cost.<\/strong> Interest expense was <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=-86.000000\">US$86m<\/a> in FY25, down from <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=-140.000000\">US$140m<\/a> in FY24 after the expensive Farfetch term loans (SOFR + 6.25%) were redeemed. Interest income still exceeds interest expense. FY25 EBIT interest cover was 5.8x [d]; LTM cover is negative.<\/p><p><strong>Liquidity<\/strong><\/p><ul>\n<li>Management states sources are sufficient for at least 12 months (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-140\">#140<\/a>).<\/li>\n<li><strong>Flag:<\/strong> the 10-Q cites only \u201cUS$0.3bn available under our credit facilities\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-130\">#130<\/a>). Stated capacity less drawings is ~US$1.15bn [d], so this needs an IR answer.<\/li>\n<li><strong>Near-term cash calls:<\/strong>\n<ul>\n<li>PIPC fines of ~US$410m, payable despite the appeal (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000261784634-7\">#7<\/a>).<\/li>\n<li>A possible NTS assessment of ~US$208m.<\/li>\n<li>Buybacks (US$907m remaining).<\/li>\n<li>Capex (\u201cseveral billion\u201d over several years).<\/li>\n<li>Potential release of payables under the Dec-2026 settlement rules. Each 10 days of DPO is ~US$0.67bn [d].<\/li>\n<\/ul><\/li>\n<li><strong>Credit rating:<\/strong> none disclosed in filings.<\/li>\n<\/ul><p><strong>Assessment.<\/strong><\/p><ul>\n<li>Solvency is not an issue.<\/li>\n<li>Coupang has shifted from a cash-rich, self-funding model (FY23 FCF US$1.76bn) to borrowing to fund buybacks while FCF is near zero. Equity has fallen to US$3.0bn.<\/li>\n<li>If the settlement-period rules bite and margins do not recover, the net cash cushion (including leases) could turn to net debt in 2027 [e].<\/li>\n<\/ul>"}]},{"id":"valuation-peers-history-and-regression","num":"13","title":"Valuation: peers, history and regression","blocks":[{"t":"h","level":2,"id":"listed-peer-comparison-ltm-to-jun-2026-sp-capital-iq-financials-prontonlp-prices-9-oct-2026","text":"13.1 Listed peer comparison (LTM to Jun-2026; S&P Capital IQ financials; ProntoNLP prices, 9-Oct-2026)"},{"t":"table","head":["Company","Ticker","Listed?","Mkt cap (US$bn)","EV/Sales","EV/EBITDA","EV/EBIT","P/E","Net debt/EBITDA","EBITDA margin","EBIT margin","Sales growth","FCF yield"],"rows":[["<strong>Coupang<\/strong>","<strong>CPNG US<\/strong>","<strong>NYSE<\/strong>","<strong>28.5<\/strong>","<strong>0.79<\/strong>","<strong>n.m.<\/strong>","<strong>n.m.<\/strong>","<strong>n.m.<\/strong>","<strong>net cash<\/strong>","<strong>-0.1%<\/strong>","<strong>-1.7%<\/strong>","<strong>9.9%<\/strong>","<strong>0.3%<\/strong>"],["Amazon","AMZN US","NASDAQ","2,861","3.85","17.7","31.9","21.2","0.8","21.8%","12.1%","15.8%","-0.4%"],["MercadoLibre","MELI US","NASDAQ","96","2.94","26.5","35.5","51.4","1.9","11.1%","8.3%","46.0%","13.0%"],["Sea Ltd","SE US","NYSE","62","2.07","21.4","25.1","38.1","net cash","9.7%","8.2%","43.1%","6.7%"],["PDD Holdings","PDD US","NASDAQ","120","0.89","4.0","4.1","9.2","net cash","22.0%","21.9%","10.0%","13.0%"],["Alibaba","BABA US / 9988 HK","NYSE / HKEX","265","1.69","17.7","37.0","25.6","net cash","9.5%","4.6%","4.4%","-4.1%"],["JD.com","JD US","NASDAQ","38","0.09","9.8","53.0","18.3","net cash","0.9%","0.2%","3.8%","10.5%"],["Vipshop","VIPS US","NYSE","6","0.22","2.4","2.9","4.3","net cash","9.1%","7.6%","-0.8%","n.a."],["NAVER","035420 KS","KRX","20","1.88","8.0","10.9","13.7","net cash","23.3%","17.3%","14.7%","5.3%"],["E-MART","139480 KS","KRX","1.4","0.41","6.9","50.4","88.4","5.8","5.9%","0.8%","-0.9%","n.m.*"],["Lotte Shopping","023530 KS","KRX","2.0","1.05","8.4","22.5","15.3","6.9","12.4%","4.7%","1.1%","n.m.*"],["Rakuten Group","4755 JP","TSE","9.4","0.53","3.1","9.5","n.m.","net cash","17.1%","5.6%","10.9%","11.4%*"],["Zalando","ZAL GY","XETRA","6.8","0.44","9.0","14.1","63.3","net cash","4.8%","3.1%","23.5%","15.2%*"],["Allegro.eu","ALE PW","WSE","13.8","4.50","16.2","23.2","31.0","0.7","27.8%","19.4%","16.3%","4.3%*"],["Jumia","JMIA US","NYSE","0.8","3.55","n.m.","n.m.","n.m.","net cash","-25.7%","-25.9%","27.8%","-5.5%"],["Walmart","WMT US","NASDAQ","888","1.29","21.6","32.8","40.2","1.4","6.0%","3.9%","6.2%","1.5%"],["<strong>Peer median<\/strong>","","","","<strong>1.29<\/strong>","<strong>9.4<\/strong>","<strong>24.2<\/strong>","<strong>25.6<\/strong>","<strong>net cash<\/strong>","<strong>9.7%<\/strong>","<strong>5.6%<\/strong>","<strong>10.9%<\/strong>","<strong>8.6%<\/strong>"]]},{"t":"c","id":"valuation-peers-history-and-regression--1","html":"<p><em>Sources: S&amp;P Capital IQ LTM revenue, EBITDA, EBIT, net income, net debt (incl.\u00a0leases), CFO and capex, with statement links in the provenance file; ProntoNLP weekly closes (\u2021). EV = price \u00d7 S&amp;P diluted shares + S&amp;P net debt, in each company\u2019s reporting currency. Chinese ADRs converted at CNY7.10/US$ and HKD7.80/US$ [e]. Market caps in US$ use FX implied by ProntoNLP\u2019s USD vs local market-cap fields [d]. *IFRS reporters book lease principal in financing, which inflates CFO-based FCF; treat with caution. Peer fiscal periods are LTM Jun-2026 except Walmart (Jul-2026) and Alibaba (Jun-2026 LTM). Growth is LTM year on year, not organic (Zalando and MELI include M&amp;A or consolidation effects).<\/em><\/p>"},{"t":"h","level":2,"id":"coupang-versus-its-own-history","text":"13.2 Coupang versus its own history"},{"t":"table","head":["Year-end","Price \u2021","EV (US$bn) [d]","EV/Sales [d]","EV/Adj. EBITDA [d]","Peer-median EV/Sales [d]","CPNG discount to peers"],"rows":[["Dec-2021","29.38","50.1","2.72","n.m.","6.00","-55%"],["Dec-2022","14.71","25.3","1.23","66.3","2.00","-39%"],["Dec-2023","16.19","26.9","1.10","25.0","2.34","-53%"],["Dec-2024","22.42","39.0","1.29","28.7","3.03","-57%"],["Dec-2025","23.37","41.0","1.19","27.6","2.95","-60%"],["<strong>Oct-2026 (LTM)<\/strong>","<strong>15.82<\/strong>","<strong>28.0<\/strong>","<strong>0.79<\/strong>","<strong>32.1<\/strong>","<strong>1.97<\/strong>","<strong>-60%<\/strong>"]]},{"t":"c","id":"valuation-peers-history-and-regression--2","html":"<p><em>The peer set for the history comparison is Amazon, MercadoLibre, Sea, NAVER, E-MART and Lotte Shopping: year-end prices from ProntoNLP (\u2021); S&amp;P annual revenue, net debt and diluted shares, in local currency.<\/em><\/p>"},{"t":"chart","key":"hist","caption":"EV/Sales at each year-end vs today"},{"t":"h","level":2,"id":"regression-evsales-vs-ebit-margin-14-listed-peers","text":"13.3 Regression: EV/Sales vs EBIT margin (14 listed peers)"},{"t":"chart","key":"regression","caption":"Regression of EV/Sales on EBIT margin"},{"t":"c","id":"valuation-peers-history-and-regression--3","html":"<ul>\n<li><strong>The fit:<\/strong> OLS on 14 listed peers (ex-Jumia) gives <strong>EV/Sales = 0.62 + 0.112 \u00d7 EBIT margin (%)<\/strong>, with <strong>R\u00b2 = 0.31<\/strong> [d]. That is a moderate fit. PDD (a high-margin outlier on China-specific risk) and Allegro (a high-multiple outlier) flatten the slope.<\/li>\n<li><strong>Where Coupang sits:<\/strong>\n<ul>\n<li>LTM EBIT margin of -1.7% implies 0.43x; Coupang trades at 0.79x, <em>above<\/em> the line.<\/li>\n<li>Pre-incident FY25 EBIT margin of 1.4% implies 0.78x, <em>on<\/em> the line.<\/li>\n<li>Our FY28E GAAP EBIT margin of 2.7% implies 0.92x [d].<\/li>\n<\/ul><\/li>\n<\/ul><p><strong>Verdict: cheap, fair or expensive?<\/strong><\/p>"},{"t":"table","head":["Lens","Reading","Verdict"],"rows":[["EV/Sales vs peers (0.79x vs 1.29x median)","-39%","<strong>Cheap<\/strong>"],["EV/Sales vs own history (0.79x vs 1.1-1.3x 2022-25)","Five-year low","<strong>Cheap<\/strong>"],["Regression (EV/Sales vs EBIT margin)","On the line at pre-incident margin; slightly above at the trough","<strong>Fair<\/strong>"],["EV/EBITDA (32x LTM adjusted; 16.6x FY27E adjusted vs 9.4x peer LTM median)","Trough earnings","<strong>Expensive on trough, fair on recovery<\/strong>"],["P/E (FY28E 38x)","GAAP EPS burdened by a 40%+ ETR and SBC","<strong>Expensive<\/strong>"],["Net debt/EBITDA","Net cash, but shrinking","<strong>Neutral<\/strong>"],["FCF yield (0.3% LTM vs 8.6% median)","FCF collapse","<strong>Expensive<\/strong>"]]},{"t":"c","id":"valuation-peers-history-and-regression--4","html":"<p><strong>Conclusion.<\/strong> Coupang is cheap only if margins recover. On sales it trades at a five-year low and a 39% discount to peers. On earnings and cash flow it is expensive. The investment case is a margin-recovery bet, which is exactly the \u201cglitch\u201d debate.<\/p>"},{"t":"h","level":2,"id":"competitors-and-comparables-public-and-private","text":"13.4 Competitors and comparables (public and private)"},{"t":"table","head":["Company","Ticker / owner","Listed?","Relevance"],"rows":[["NAVER","035420 KS","Yes (KRX)","#1 domestic rival: marketplace, Plus membership, Kurly N Mart"],["E-MART / Shinsegae (Gmarket, SSG.com)","139480 KS (Gmarket and SSG.com are unlisted subsidiaries / JV [u])","Parent listed","Owns ex-eBay Korea (Gmarket) (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177519257-675\">#675<\/a>)"],["Lotte Shopping (Lotte ON)","023530 KS","Yes","Omnichannel rival (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256750115-92\">#92<\/a>)"],["AliExpress (Alibaba)","BABA US / 9988 HK","Yes","Cross-border entrant (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-308\">#308<\/a>)"],["Temu (PDD Holdings)","PDD US","Yes","Cross-border entrant"],["11st","SK Square subsidiary [u]","No (parent 402340 KS listed [u])","Domestic marketplace"],["Kurly (Market Kurly)","Private [u]","No","Fresh grocery; partner of Naver"],["Musinsa","Private [u]","No","Fashion e-commerce"],["Baemin (Woowa Brothers)","Delivery Hero (DHER GY); Uber offer pending","Parent listed","#1 Korean food delivery vs Coupang Eats (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000263635795-1089\">#1089<\/a>)"],["Yogiyo","Private [u]","No","Korean food delivery"],["Netflix / Tving","NFLX US / CJ ENM subsidiary [u]","Netflix listed","Compete with Coupang Play"],["momo.com","8454 TT [u]","Yes [u]","Taiwan e-commerce"],["Shopee (Sea)","SE US","Yes","Taiwan marketplace"],["PChome","8044 TT [u]","Yes [u]","Taiwan e-commerce"],["Foodpanda Taiwan","Delivery Hero \u2192 Grab (pending)","No","Taiwan food delivery (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000257375768-325\">#325<\/a>)"],["Amazon, Walmart, MercadoLibre, Allegro, Zalando, Rakuten, JD, Vipshop, Jumia","See table 13.1","Yes","Global e-commerce comparables"]]}]},{"id":"ma-in-the-industry-is-coupang-a-takeover-target","num":"14","title":"M&A in the industry; is Coupang a takeover target?","blocks":[{"t":"h","level":2,"id":"recent-industry-transactions-last-five-years","text":"14.1 Recent industry transactions (last five years)"},{"t":"table","head":["Announced / closed","Target","Acquirer","Consideration","EV (local) [d]","EV/Sales [d]","EV/EBITDA [d]","Source"],"rows":[["Jul-2026 (pending; close H2\u201927)","Delivery Hero SE (incl.\u00a0Baemin, Korea)","Uber Technologies","EUR41.50/sh; equity US$14.8bn","~EUR15.8bn","1.06x LTM","n.m. (LTM EBITDA EUR144m)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000263635795-1089\">#1089<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000263635795-84\">#84<\/a>, <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=265578278\">S&amp;P LTM<\/a>"],["Mar-2026 (pending TFTC)","Foodpanda Taiwan","Grab Holdings","US$600m cash","US$0.6bn","n.a.","n.a.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000257375768-325\">#325<\/a>"],["May-2024 (blocked Jan-2025)","Foodpanda Taiwan","Uber Technologies","~US$950m cash/debt-free; US$236m break fee paid","US$0.95bn","n.a.","n.a.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255458473-2045\">#2045<\/a>"],["May-2025 / closed Oct-2025","Deliveroo plc","DoorDash","180p/sh; equity ~GBP2.8bn; fair value US$3,724m","~GBP2.4bn","1.15x FY24","n.m.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255598146-2247\">#2247<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255598146-2063\">#2063<\/a>"],["Feb-2025","Just Eat Takeaway.com","Prosus","EUR4.1bn (US$4.6bn)","~EUR4.5bn","1.26x FY24","28.7x FY24","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000243246805-379\">#379<\/a>, <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=238578856&amp;uctSearch=3564.000000\">S&amp;P<\/a>"],["Jul-2025","Ceconomy (MediaMarkt/Saturn)","JD.com","EUR4.60/sh (59.8% for EUR1.3bn)","~EUR3.8bn","0.17x FY Sep-24","9.6x","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000258587508-1966\">#1966<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000258587508-1971\">#1971<\/a>"],["Dec-2024 / 2025","ABOUT YOU","Zalando","EUR6.50/sh; ~EUR1.14bn","~EUR1.14bn","0.59x FY Feb-24","n.m.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000257202319-4947\">#4947<\/a>"],["Jan-2024","Farfetch (business and assets)","Coupang 80.1% / Greenoaks 19.9%","Bridge loan (US$500m facility, US$150m drawn) + ~US$300m contributed + up to US$200m committed","n.d.","n.d. (Farfetch FY22 revenue <a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=200874269&amp;uctSearch=2316.680000\">US$2.3bn<\/a>)","n.m.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000215408244-4\">#4<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2038\">#2038<\/a>"],["Oct-2022 / Jan-2023","Poshmark","NAVER","Not returned by tools [u]","n.a.","n.a.","n.a.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-318\">#318<\/a>"],["Jun-2021 / closed Nov-2021","eBay Korea (Gmarket, Auction)","E-mart (Shinsegae)","80.01% for ~US$3.0bn gross cash; implies ~US$3.75bn for 100% [d]; eBay\u2019s retained 19.99% valued at US$728m","~US$3.7bn","n.a. (target revenue not in tools)","n.a.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177519257-675\">#675<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000181144328-1308\">#1308<\/a>"],["2024-25","Gmarket / AliExpress Korea joint venture","Alibaba / Shinsegae","Not found in tools [u]","n.a.","n.a.","n.a.","Unverified"]]},{"t":"c","id":"ma-in-the-industry-is-coupang-a-takeover-target--1","html":"<p><em>Multiples are derived using target financials from S&amp;P Capital IQ: Delivery Hero LTM Jun-26 revenue EUR14.93bn and net debt EUR2.61bn; Deliveroo FY24 revenue GBP2.07bn and net cash GBP0.41bn; JET FY24 revenue EUR3.56bn, EBITDA EUR156m, net debt EUR379m; Ceconomy FY24 revenue EUR22.4bn, EBITDA EUR394m, net debt EUR1.62bn; ABOUT YOU FY24 revenue EUR1.94bn. Delivery Hero equity is converted at EUR/US$1.12, implied by ProntoNLP\u2019s USD vs local market caps [d].<\/em><\/p><p><strong>Read-across.<\/strong> Delivery and e-commerce platform control deals have cleared at <strong>~1.1-1.3x sales<\/strong>, with very high or meaningless EBITDA multiples because targets were near break-even. Low-margin omnichannel retail (Ceconomy) clears at 0.2x sales and ~10x EBITDA. Two of these deals land directly in Coupang\u2019s markets. <strong>Uber\u2019s offer for Delivery Hero<\/strong> consolidates Coupang Eats\u2019 main Korean rival, Baemin, under a global strategic owner. <strong>Grab\u2019s purchase of Foodpanda Taiwan<\/strong> does the same for Taiwan food delivery, after Uber\u2019s US$950m attempt was blocked.<\/p>"},{"t":"h","level":2,"id":"is-coupang-a-takeover-target","text":"14.2 Is Coupang a takeover target?"},{"t":"c","id":"ma-in-the-industry-is-coupang-a-takeover-target--2","html":"<p><strong>Pros<\/strong><\/p><ul>\n<li>The valuation is at a five-year low on sales (0.79x) with net cash.<\/li>\n<li>It is a scarce asset: a dominant owned-logistics network in a large, high-penetration e-commerce market.<\/li>\n<li>Strategic logic exists for global platforms (Amazon has no direct Korean presence [u]; Walmart; Uber, which is consolidating delivery) and for large private-equity or sovereign capital.<\/li>\n<li>Developing Offerings assets could be carved out: Farfetch, Eats, Taiwan.<\/li>\n<\/ul><p><strong>Impediments<\/strong><\/p><ol type=\"1\">\n<li><strong>Control.<\/strong> Bom Kim holds all Class B shares and <strong>74.1% of the votes<\/strong> (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1187\">#1187<\/a>). No deal happens without him, and the 10-K says his control \u201cwill limit or preclude your ability to influence corporate matters\u2026 including\u2026 any merger\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1188\">#1188<\/a>).<\/li>\n<li><strong>Size.<\/strong> An EV of ~US$28bn rises to ~US$37bn at a 30% premium [d].<\/li>\n<li><strong>Korean regulation.<\/strong> There is political and regulatory sensitivity after the breach, a business-group designation (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1007\">#1007<\/a>), data-sovereignty concerns, and KFTC merger control.<\/li>\n<li><strong>No obvious domestic buyer.<\/strong> NAVER\u2019s market cap is ~US$20bn.<\/li>\n<li><strong>Litigation and regulatory contingencies<\/strong> would need to be priced.<\/li>\n<\/ol><p><strong>Most plausible path.<\/strong> A founder-led take-private with financial partners, or minority carve-outs. A hostile approach is impossible.<\/p><p><strong>Potential takeout multiples [d]<\/strong><\/p>"},{"t":"table","head":["Method","Multiple","Applied to","Implied EV","Implied value per share"],"rows":[["Delivery-platform precedent median","1.15x sales","LTM revenue US$35.5bn","US$40.8bn","~US$23"],["Range of precedents","0.9-1.3x sales","LTM revenue","US$31.9-46.1bn","~US$18-26"],["Premium approach","30-40% over US$15.82","","","US$20.6-22.1"],["EBITDA cross-check","~20x FY25 adjusted EBITDA (~US$1.49bn)","","US$29.7bn","~US$17"]]},{"t":"c","id":"ma-in-the-industry-is-coupang-a-takeover-target--3","html":"<p><strong>Conclusion.<\/strong> A plausible control value is <strong>~US$20-26 a share (1.0-1.3x LTM sales)<\/strong>. The probability of a bid is low, given the control structure. Takeover premium should not be part of the core thesis. Treat it as a tail option if the founder\u2019s own incentives (personal tax needs; <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000232383623-311\">#311<\/a>) or regulatory fatigue push toward a take-private.<\/p>"},{"t":"h","level":2,"id":"coupangs-own-acquisitions-last-10-years","text":"14.3 Coupang\u2019s own acquisitions (last 10 years)"},{"t":"table","head":["Date","Target / transaction","Consideration","Multiple","Source"],"rows":[["Announced 18-Dec-2023; closed 30-Jan-2024","<strong>Farfetch Holdings plc<\/strong>, business and assets, bought out of UK pre-pack administration via Surpique LP (80.1% Coupang)","US$500m bridge facility at 12.5% PIK (US$150m advanced); ~US$300m contributed at close (cash plus loan cancellation); up to US$200m more committed; Farfetch term loans (US$575m) assumed, then redeemed in 2025","n.d.; Farfetch was 5% of FY24 revenue","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000215408244-0\">#0<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000215408244-4\">#4<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000215408244-21\">#21<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2035\">#2035<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1950\">#1950<\/a>"],["Feb-2025","Remaining 40% of Palm Angels (Farfetch-owned brand), then sale of the brand rights","Not disclosed","n.d.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2050\">#2050<\/a>"],["7-Apr-2025","Greenoaks\u2019 19.9% minority interest in Surpique LP (related party)","US$140.1m (US$14.1m cash + 5,465,099 Class A shares); fair value booked US$122m","Implies ~US$0.70bn for 100% of Surpique [d]","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000239328925-1\">#1<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000239328925-2\">#2<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2052\">#2052<\/a>"]]},{"t":"c","id":"ma-in-the-industry-is-coupang-a-takeover-target--4","html":"<p>No other business combinations appear in the FY2021-FY2025 10-Ks (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218853463-1415\">#1415<\/a>). Pre-2021 deals are not covered by the tools [u].<\/p>"}]},{"id":"management-assessment","num":"15","title":"Management assessment","blocks":[{"t":"table","head":["Executive","Role and tenure","Track record","Skin in the game","Notes and red flags"],"rows":[["<strong>Bom Kim<\/strong> (founder)","Founder (2010); CEO and Chairman throughout the listed period (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177952319-1710\">#1710<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1707\">#1707<\/a>)","Built Korea\u2019s largest owned e-commerce logistics network from scratch. Took the company public in 2021 at US$35, delivered first adjusted-EBITDA profitability (2022) and GAAP profits (2023). Turned Farfetch to positive economics by Q4\u201925 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-121\">#121<\/a>). <strong>Misses:<\/strong> Japan v1 exit (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002800142-72\">#72<\/a>), the scale of Taiwan losses, and the 2025 data incident and regulatory relations","All Class B (29 votes per share): <strong>74.1% of voting power<\/strong>, down from 76.2% in FY21 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1187\">#1187<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177952319-1160\">#1160<\/a>). Economic stake \u2265~9% [d]. Pay not available (proxy not indexed)","Adopted a plan to sell up to 15m shares in Aug-2024, citing tax needs (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000232383623-311\">#311<\/a>). Named in breach suits (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1980\">#1980<\/a>). A regulatory \u201cdesignation\u201d in Korea (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-239\">#239<\/a>). Remains CEO and Chair after the breach"],["<strong>Gaurav Anand<\/strong>","CFO, at least since 2021 (appointment agreement 22-Feb-2021, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2080\">#2080<\/a>)","Steered the move to profitability, the Farfetch refinancing, and the 2025 RCF and term-loan refinancing (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1514\">#1514<\/a>)","10b5-1 sales plans: up to 301k shares (Dec-2024) and up to 300k shares (Mar-2026) (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237408246-1547\">#1547<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000259645823-300\">#300<\/a>)","Reassigned to the Korean subsidiary from 1-Nov-2025 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2080\">#2080<\/a>). Sales plan adopted after the breach"],["<strong>Harold L. Rogers<\/strong>","General Counsel and Chief Administrative Officer; <strong>interim CEO of Coupang Corp.\u00a0(Korea)<\/strong> since 10-Dec-2025 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000253203320-10\">#10<\/a>)","Led the incident response and regulatory process","10b5-1 plan for up to 352,602 shares (Mar-2026, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000259645823-303\">#303<\/a>)","A lawyer running the Korean operating entity; a permanent CEO has not been named [u]"],["<strong>Jonathan Lee<\/strong>","Chief Accounting Officer since 26-Sep-2022 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000193145117-0\">#0<\/a>)","Ex-TriNet CAO; Arch Capital deputy CFO (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000193145117-3\">#3<\/a>)","10b5-1 plan (May-2026, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-294\">#294<\/a>)",""],["<strong>Departures<\/strong>","CTO Thuan Pham (2022, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000186080531-0\">#0<\/a>); TJ Kim (2024, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000213983483-0\">#0<\/a>); Hanseung Kang ceased to be an officer (Jun-2025, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000242143978-0\">#0<\/a>); Pranam Kolari (Nov-2025, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000250216310-0\">#0<\/a>); former Korea CEO (Dec-2025)","","","No successor CTO filing was found"]]},{"t":"h","level":2,"id":"capital-allocation-history","text":"15.1 Capital allocation history"},{"t":"c","id":"management-assessment--1","html":"<p><strong>ROE and ROIC under the current team [d].<\/strong> ROE was ~3.7% in FY24 and ~4.5% in FY25. ROIC uses a notional 25% tax on GAAP EBIT, with invested capital defined as equity + debt + leases \u2212 cash:<\/p>"},{"t":"table","head":["Year","ROIC"],"rows":[["FY23","~22%"],["FY24","~14%"],["FY25","~13%"],["LTM","Negative"]]},{"t":"c","id":"management-assessment--2","html":"<p>ROIC looks high because negative working capital funds most of the asset base. That flatters it, and it is exactly what the Dec-2026 settlement rules threaten.<\/p><p><strong>Good decisions<\/strong><\/p><ul>\n<li>Reinvesting the Korean cash flow into the logistics network.<\/li>\n<li>Opportunistic, cheap entry into Farfetch (an administration deal).<\/li>\n<li>Refinancing expensive Farfetch term loans (SOFR + 6.25%) with cheaper revolver debt (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1403\">#1403<\/a>).<\/li>\n<li>Buying back stock in 2025-26 at an average ~US$20.8 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-369\">#369<\/a>).<\/li>\n<\/ul><p><strong>Questionable decisions<\/strong><\/p><ul>\n<li>Buybacks of US$850m in H1\u201926 funded alongside a US$750m revolver draw while FCF fell to ~US$0.1bn.<\/li>\n<li>Ongoing ~US$1bn a year of Developing Offerings losses with no published return hurdle. No ROIC target was found (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-424\">#424<\/a>).<\/li>\n<li>A related-party buyout of Greenoaks at a premium to its contributed capital (Section 25).<\/li>\n<\/ul>"},{"t":"h","level":2,"id":"archetype-and-implications","text":"15.2 Archetype and implications"},{"t":"c","id":"management-assessment--3","html":"<p>Coupang is a <strong>founder-controlled, founder-led company<\/strong>. That brings long-term orientation, willingness to absorb losses (Taiwan) and speed. It also carries key-person and governance risk: dual-class shares, no external check on capital allocation, and political exposure in Korea.<\/p><p>At this stage the founder model is an asset operationally: rebuilding trust and fixing utilisation. It is a liability in regulatory diplomacy, where a Korean-resident professional CEO for Coupang Corp.\u00a0would help. The prolonged \u201cinterim\u201d status at the Korean subsidiary is the key management gap to watch.<\/p>"},{"t":"h","level":2,"id":"recent-senior-management-changes","text":"15.3 Recent senior management changes"},{"t":"c","id":"management-assessment--4","html":"<ul>\n<li>The Korea CEO resigned on 10-Dec-2025; Harold Rogers became interim CEO (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000253203320-10\">#10<\/a>).<\/li>\n<li>The CFO was reassigned to Korea from 1-Nov-2025 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2080\">#2080<\/a>).<\/li>\n<li>VP Search Kolari left (Nov-2025).<\/li>\n<li>Kang moved to a new role (Jun-2025).<\/li>\n<\/ul>"}]},{"id":"board-of-directors","num":"16","title":"Board of Directors","blocks":[{"t":"table","head":["Director","Joined (evidence)","Committees","Background / other affiliations","Independence"],"rows":[["Bom Kim (Chair)","Founder; Chair throughout (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177952319-1710\">#1710<\/a>)","n/a","Founder and CEO","Controlling holder"],["Neil Mehta (Lead Independent Director per filing context, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000239328925-4\">#4<\/a>)","On board by FY21 10-K (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177952319-1710\">#1710<\/a>)","n/a \u2021","Managing Partner of <strong>Greenoaks<\/strong> since 2012; Greenoaks is a related party (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2050\">#2050<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000239328925-5\">#5<\/a>)","Related-party interest"],["Benjamin Sun","On board by FY21 10-K","n/a \u2021","Not available in tools \u2021","n/a \u2021"],["Kevin Warsh","On board by FY21 10-K","n/a \u2021","Nominated as Federal Reserve Chair (30-Jan-2026); will resign from the board if confirmed (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255152730-0\">#0<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255152730-1\">#1<\/a>). Former Fed Governor [u]","n/a \u2021"],["Pedro Franceschi","15-Mar-2022 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000178637463-0\">#0<\/a>)","Compensation (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000178637463-1\">#1<\/a>)","Co-founder of Brex [u]","n/a \u2021"],["Jason Child","14-Apr-2022 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000180700685-0\">#0<\/a>)","Audit (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000180700685-1\">#1<\/a>)","CFO of Arm Holdings [u]","n/a \u2021"],["Ambereen Toubassy","8-Mar-2023 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000200940081-0\">#0<\/a>)","Audit (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000200940081-1\">#1<\/a>)","Not available in tools \u2021","n/a \u2021"],["Asha Sharma","21-Jun-2024 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000225830033-0\">#0<\/a>)","Compensation","Technology and operating executive (ex-Instacart; Microsoft) [u]","Independent under NYSE standards (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000225830033-1\">#1<\/a>)"]]},{"t":"c","id":"board-of-directors--1","html":"<p><strong>Board changes in the last five years<\/strong><\/p><ul>\n<li>Franceschi joined (Mar-2022; board grew from 6 to 7).<\/li>\n<li>Child joined (Apr-2022).<\/li>\n<li>Toubassy joined (Mar-2023; board grew from 7 to 8).<\/li>\n<li><strong>Harry You, Audit Committee Chair, retired at the June-2023 AGM<\/strong> (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000203357895-0\">#0<\/a>).<\/li>\n<li>Sharma joined (Jun-2024).<\/li>\n<li>Warsh\u2019s contingent departure was announced in Feb-2026; whether he has been confirmed is not in the tools.<\/li>\n<\/ul><p><strong>Governance<\/strong><\/p><ul>\n<li>Bylaw amendments in Jun-2024 narrowed shareholders\u2019 advance-notice disclosure requirements (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000225962227-1\">#1<\/a>).<\/li>\n<li>Non-employee directors receive an annual RSU grant of US$300k, plus committee grants (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000200940081-3\">#3<\/a>).<\/li>\n<li>Committee chairs, director biographies and the full independence roster are in the 2026 proxy, which is not indexed in the tools \u2021.<\/li>\n<\/ul>"}]},{"id":"shareholders-activism-and-short-interest","num":"17","title":"Shareholders, activism and short interest","blocks":[{"t":"table","head":["#","Holder","Type","Stake","Source"],"rows":[["1","Bom Kim","Insider / founder","100% of Class B; 74.1% of votes; economic stake \u2265~9% [d]","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1187\">#1187<\/a>"],["2","Greenoaks Capital funds (director Neil Mehta)","Institutional / VC (related party)","~3.2% of Class A (filing context); received 5.47m shares in Apr-2025","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000239328925-2\">#2<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000239328925-4\">#4<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000239328925-5\">#5<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2050\">#2050<\/a>"],["3","Maverick Holdings C","Institutional (early investor)","Sold 10m shares back to Coupang at US$17.79 (Apr-2024); residual stake n.a.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000220937380-0\">#0<\/a>"],["4-10","SoftBank Vision Fund (historically the largest outside holder [u]), index funds, long-only institutions","Institutional","<strong>Not available.<\/strong> S&P/ProntoNLP do not index the proxy beneficial-ownership table or 13F/13G filings \u2021","n/a"]]},{"t":"c","id":"shareholders-activism-and-short-interest--1","html":"<p><em>Analyst note: the full top-10 holder table (with percentages and recent changes) requires the Capital IQ ownership module or the 2026 DEF 14A. Neither is reachable through the connectors used for this report.<\/em><\/p><p><strong>Activism.<\/strong> We found no 13D filings, no shareholder proposals (every AGM from 2022 to 2026 carried management proposals only, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000261896065-1\">#1<\/a>) and no activist campaigns. Say-on-pay passed easily in 2026: 5.49bn votes for, 96m against (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000261896065-8\">#8<\/a>). The control structure makes activism structurally ineffective. Pressure is coming instead through litigation:<\/p><ul>\n<li>Securities class action, <em>Lee and Park<\/em>, filed 6-Jan-2026 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-415\">#415<\/a>).<\/li>\n<li>Consumer class action in the EDNY, seeking damages for US and Korean residents (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-423\">#423<\/a>).<\/li>\n<li>Derivative suits, including <em>Warga v. Bom Kim<\/em>, and board demands (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1980\">#1980<\/a>).<\/li>\n<li>The appeal of the dismissed IPO class action (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-408\">#408<\/a>).<\/li>\n<\/ul><p><strong>Short interest.<\/strong> Not available in S&amp;P or ProntoNLP \u2021. No short-seller reports or named short sellers were found.<\/p>"}]},{"id":"strategic-initiatives-last-10-years-success-failure-status","num":"18","title":"Strategic initiatives (last 10 years): success, failure, status","blocks":[{"t":"table","head":["Initiative","Launched","Status (Oct-2026)","Verdict","Evidence"],"rows":[["Rocket Delivery (next-day; dawn)","~2014","Core franchise; extended to Taiwan","<strong>Success.<\/strong> The foundation of the moat","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-31\">#31<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-99\">#99<\/a>"],["WOW membership","By 2019-20","6m (2020) \u2192 14m (2023) \u2192 record in 2026","<strong>Success<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002514904-63\">#63<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-271\">#271<\/a>"],["Rocket Fresh","Pre-2021","Grows above group; once a drag (2021 under-utilisation)","<strong>Success after a costly ramp<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002514904-128\">#128<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-148\">#148<\/a>"],["Marketplace + FLC / Rocket Growth","~2022 [u]","Faster than 1P; margin-accretive","<strong>Success<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-145\">#145<\/a>"],["Coupang Eats","Pre-2021","\u201cSelf-sustaining\u201d with Rocket Now; KFTC bundling challenge","<strong>Partial success.<\/strong> Regulatory risk","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-129\">#129<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2008\">#2008<\/a>"],["Coupang Play","Pre-2021","WOW benefit; no standalone KPIs","<strong>Unproven<\/strong> (retention tool)","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002283898-114\">#114<\/a>"],["Coupang Pay / fintech","n.d.","Active; EFTA settlement-fund rules from Dec-26","<strong>Unproven; regulatory drag<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-616\">#616<\/a>"],["Japan v1 (quick commerce)","~2021","<strong>Exited by Q1\u201923<\/strong>","<strong>Failure<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002800142-72\">#72<\/a>"],["Japan v2 (Rocket Now food)","By Q4\u201925","Early","<strong>Too early to call<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-118\">#118<\/a>"],["Taiwan","2021-23","Triple-digit growth; largest Developing Offerings loss","<strong>Promising operationally, costly financially<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003578475-94\">#94<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-224\">#224<\/a>"],["Farfetch","Jan-2024","Restructured; positive economics from Q4\u201925","<strong>Turnaround under way; cheap option<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-121\">#121<\/a>"],["AI and automation","Ongoing","Deployed across operations","<strong>Enabler<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-390\">#390<\/a>"],["Share buybacks","May-2025","US$1.09bn executed under the US$2bn programme","<strong>Well timed in 2026 (~US$19.5), but debt-funded<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-369\">#369<\/a>"]]}]},{"id":"stakes-in-other-companies","num":"19","title":"Stakes in other companies","blocks":[{"t":"c","id":"stakes-in-other-companies--1","html":"<p>We found <strong>no material equity-method or minority stakes<\/strong> in listed or unlisted companies in the FY2021-FY2025 10-Ks or the 2026 10-Qs (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218853463-1415\">#1415<\/a>). The strategically relevant holdings are wholly owned subsidiaries:<\/p><ul>\n<li><strong>Farfetch / Surpique LP.<\/strong> 100% since April 2025, via the related-party buyout (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2052\">#2052<\/a>). Strategically optional, financially small. The implied value of ~US$0.7bn [d] is ~2.5% of EV.<\/li>\n<li><strong>Coupang Pay.<\/strong> Licensed fintech subsidiary subject to EFTA rules (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2061\">#2061<\/a>).<\/li>\n<li><strong>CPLB<\/strong> (private label) and <strong>CFS<\/strong> (fulfilment services). CFS is the subject of the ~US$208m NTS transfer-pricing claim (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-345\">#345<\/a>).<\/li>\n<\/ul>"}]},{"id":"dividends-buybacks-and-treasury-shares-last-five-years","num":"20","title":"Dividends, buybacks and treasury shares (last five years)","blocks":[{"t":"table","head":["Period","Dividend per share","Shares repurchased","Amount","Average price [d]","Source"],"rows":[["FY2021","Nil","Nil (US$97m of pre-IPO unit repurchases in FY2020)","n.a.","n.a.","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000177952319-1453\">#1453<\/a>"],["FY2022","Nil","Nil","Nil","n.a.","S&P (no repurchase line)"],["FY2023","Nil","Nil","Nil","n.a.","S&P"],["FY2024","Nil","10.0m (private, from Maverick)","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=-178.000000\">US$178m<\/a>","US$17.79","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000220937380-0\">#0<\/a>"],["FY2025","Nil","8.8m (Q3 2.8m; Q4 ~6.0m)","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=255973354&amp;uctSearch=-243.000000\">US$243m<\/a>","~US$27.6","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1487\">#1487<\/a>"],["Q1 2026","Nil","20.4m","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=259645823&amp;uctSearch=-391.000000\">US$391m<\/a>","~US$19.2","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000259645823-373\">#373<\/a>"],["Q2 2026","Nil","23.2m","<a href=\"https://www.capitaliq.spglobal.com/apisv3/spg-webplatform-core/docviewer?mid=264559057\">US$459m<\/a>","~US$19.8","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-369\">#369<\/a>"],["<strong>Total since May-2025 programme<\/strong>","","<strong>~52.5m<\/strong>","<strong>US$1,093m<\/strong>","<strong>~US$20.8<\/strong>","Authorisation US$2bn (May-25 + May-26); US$907m remaining (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-140\">#140<\/a>)"]]},{"t":"c","id":"dividends-buybacks-and-treasury-shares-last-five-years--1","html":"<p><strong>Dividend policy.<\/strong> \u201cWe have not in the past and do not anticipate declaring or paying any cash dividends in the foreseeable future\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1311\">#1311<\/a>). Korean subsidiary covenants also restrict upstream dividends (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2061\">#2061<\/a>).<\/p><p><strong>Treasury shares and cancellations.<\/strong> Whether repurchased shares are retired or held in treasury is <strong>not disclosed<\/strong> in indexed text. S&amp;P returns no treasury-stock line \u2021. Offsetting issuance: 5,465,099 shares to Greenoaks (Apr-2025, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000239328925-2\">#2<\/a>), plus the annual evergreen increase to the equity plan through 2031 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1884\">#1884<\/a>).<\/p>"}]},{"id":"adversarial-deep-dive-bull-case-bear-case-pre-mortem-contrarian-view","num":"21","title":"Adversarial deep dive: bull case, bear case, pre-mortem, contrarian view","blocks":[{"t":"h","level":2,"id":"bull-case","text":"21.1 Bull case"},{"t":"c","id":"adversarial-deep-dive-bull-case-bear-case-pre-mortem-contrarian-view--1","html":"<ol type=\"1\">\n<li><strong>The moat survived a stress test.<\/strong>\n<ul>\n<li>Customers left for alternatives with ample time to try them, then came back \u201cnot splitting their prior spend\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-267\">#267<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-268\">#268<\/a>).<\/li>\n<li>WOW is at an all-time high (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-271\">#271<\/a>).<\/li>\n<li>Physical-network scale (78m sq ft) and cohort economics (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-69\">#69<\/a>) are intact. Management: \u201cnothing has structurally changed\u201d (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-252\">#252<\/a>).<\/li>\n<\/ul><\/li>\n<li><strong>Margin recovery is mostly arithmetic.<\/strong>\n<ul>\n<li>The 390bp PC margin compression came from volume below a fixed-cost demand curve, plus one-off promotions and marketing (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-170\">#170<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-204\">#204<\/a>). Management calls this reversible (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-261\">#261<\/a>).<\/li>\n<li>Each 100bp of PC margin is ~US$0.35bn of EBITDA [d].<\/li>\n<li>Vouchers have finished (mid-April 2026) and marketing steps down in 2027, so 2027 comparisons are easy.<\/li>\n<\/ul><\/li>\n<li><strong>Secular growth levers.<\/strong>\n<ul>\n<li>Online is still 41.5% of Korean retail (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-305\">#305<\/a>), and Coupang\u2019s wallet share is below US-peer levels (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-80\">#80<\/a>).<\/li>\n<li>Fresh, FLC and ads are margin-accretive.<\/li>\n<li>Taiwan is reaching Dawn Delivery in one year against four in Korea (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-99\">#99<\/a>).<\/li>\n<li>Farfetch has turned to positive economics (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003665452-121\">#121<\/a>).<\/li>\n<\/ul><\/li>\n<li><strong>Potential earnings surprises.<\/strong>\n<ul>\n<li>KRW mean reversion: a 10% move is worth ~US$3.5-4bn of revenue.<\/li>\n<li>A faster DO loss cut (Q2 losses down US$110m QoQ already).<\/li>\n<li>Insurance recoveries on the Incheon fire.<\/li>\n<li>A successful PIPC appeal (US$410m accrued).<\/li>\n<\/ul><\/li>\n<li><strong>Capital allocation.<\/strong> Buying back ~3% of the shares in H1\u201926 at ~US$19.5 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-369\">#369<\/a>), with US$907m of authorisation left. The founder\u2019s incentives favour long-term value.<\/li>\n<\/ol>"},{"t":"h","level":2,"id":"bear-case-three-risks-that-could-permanently-impair-the-business","text":"21.2 Bear case: three risks that could permanently impair the business"},{"t":"c","id":"adversarial-deep-dive-bull-case-bear-case-pre-mortem-contrarian-view--2","html":"<ol type=\"1\">\n<li><strong>The Korean regulatory regime turns hostile to the model, not just the incident.<\/strong> Four threats at once:\n<ul>\n<li>A night-delivery ban would end Dawn Delivery (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-862\">#862<\/a>).<\/li>\n<li>Forced unbundling of Eats from WOW (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2009\">#2009<\/a>).<\/li>\n<li>Shortened merchant settlement periods that drain the payables float (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-619\">#619<\/a>).<\/li>\n<li>Escalating fines and criminal referrals (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-465\">#465<\/a>). Cumulative fines are already ~US$531m [d].<\/li>\n<\/ul><\/li>\n<li><strong>Competitive leakage becomes permanent.<\/strong>\n<ul>\n<li>Naver\u2019s asset-light alliance (CJ Logistics, Kurly) plus its Plus membership (with Netflix) offers \u201cgood enough\u201d speed without the capex. Naver gained GMV and members in January 2026 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003646016-298\">#298<\/a>).<\/li>\n<li>Chinese platforms exceed 10m users (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-344\">#344<\/a>).<\/li>\n<li>Coupang\u2019s 2026 promotions suggest pricing power has weakened (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-167\">#167<\/a>).<\/li>\n<\/ul><\/li>\n<li><strong>The capital-allocation and cash engine breaks.<\/strong>\n<ul>\n<li>FCF has fallen from US$1.76bn (FY23) to ~US$0.1bn (LTM).<\/li>\n<li>Taiwan losses run at ~US$1bn a year with no published hurdle.<\/li>\n<li>Buybacks are being funded with debt.<\/li>\n<li>If margins stall at ~5% PC and the float shrinks, Coupang becomes a low-return retailer valued like Lotte Shopping or E-MART (0.4-1.0x sales).<\/li>\n<\/ul><\/li>\n<\/ol><p><strong>Margin compression and revenue deceleration risk.<\/strong> PC growth slowed from +18% cc (Q3\u201925) to +5-8% cc (H1\u201926). Management\u2019s Q3 guide implies roughly 6-7% PC growth in constant currency (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-432\">#432<\/a>). If the non-returning cohort never comes back and promotions persist, the PC margin could settle at ~6%, not 8%+.<\/p><p><strong>High expectations.<\/strong> Not on revenue: the stock is at 0.79x sales. But the market still assumes a <strong>return to profitability<\/strong>. On FY27E the stock trades at 113x GAAP EPS and 16.6x adjusted EBITDA. Any further slip in the recovery date (it has slipped once already) would hurt.<\/p>"},{"t":"h","level":2,"id":"pre-mortem-it-is-october-2027-and-cpng-is-at-us9.-what-went-wrong","text":"21.3 Pre-mortem: \u201cIt is October 2027 and CPNG is at US$9. What went wrong?\u201d"},{"t":"c","id":"adversarial-deep-dive-bull-case-bear-case-pre-mortem-contrarian-view--3","html":"<ol type=\"1\">\n<li>The Q4\u201926 guide for 2027 showed PC margin recovering only to ~6.5%, not \u201cpre-incident\u201d, because promotions had to stay to defend share against Naver and Chinese platforms.<\/li>\n<li>The KFTC ordered Eats unbundled from WOW. WOW churn rose and Eats volume fell.<\/li>\n<li>The settlement-period rule took ~US$0.7-1.0bn of payables float out in 2027. Combined with capex and the PIPC payment, the company moved to net debt and stopped buybacks.<\/li>\n<li>The KRW stayed weak and USD revenue growth stayed in mid-single digits.<\/li>\n<li>A night-delivery bill progressed in the National Assembly.<\/li>\n<li>Taiwan losses did not fall, and the market started valuing DO at a negative number.<\/li>\n<\/ol><p><em>Early-warning indicators:<\/em> PC margin in Q4\u201926 and Q1\u201927; Q4\u201926 WOW and active-customer disclosure; the KFTC decision; payables days after Dec-2026; the size and pace of buybacks; DO loss guidance for 2027.<\/p>"},{"t":"h","level":2,"id":"are-multiples-too-high","text":"21.4 Are multiples too high?"},{"t":"c","id":"adversarial-deep-dive-bull-case-bear-case-pre-mortem-contrarian-view--4","html":"<p>On trough numbers, yes: 32x LTM adjusted EBITDA, n.m. P/E, 0.3% FCF yield. On normalised numbers, no. FY25-level adjusted EBITDA margins (4.3%) on FY27E sales of US$41bn would give ~US$1.8bn of EBITDA, or ~16x [d]. At the FY28E base case the stock is at 10.7x adjusted EBITDA and 0.61x sales. The question is not whether the multiple is high. It is whether margins normalise.<\/p>"},{"t":"h","level":2,"id":"the-contrarian-view-what-the-market-refuses-to-see","text":"21.5 The contrarian view: what the market refuses to see"},{"t":"c","id":"adversarial-deep-dive-bull-case-bear-case-pre-mortem-contrarian-view--5","html":"<p>The market is treating Coupang\u2019s USD-reported 2026 as the new run-rate. In fact, 2026 combines four temporary distortions:<\/p><ol type=\"1\">\n<li>A KRW at a 15-year low (-7pts on PC growth in Q2).<\/li>\n<li>~US$1.2bn of compensation vouchers netted against revenue.<\/li>\n<li>A one-off reacquisition marketing spend.<\/li>\n<li>US$410m of fines and ~US$246m of fire exposure.<\/li>\n<\/ol><p>Strip these out and Coupang is still a ~10% constant-currency grower, with 24.7m customers and its highest-ever WOW membership.<\/p><p>A second under-appreciated point: <strong>the Delivery Hero/Baemin deal re-prices Korean delivery assets.<\/strong> Uber is paying ~1.1x sales for a business whose crown jewel competes head-on with Coupang Eats (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000263635795-1089\">#1089<\/a>), while Coupang as a whole trades at 0.79x sales.<\/p><p>The contrarian <em>bear<\/em> view the market also refuses to see is the working-capital time bomb. Coupang\u2019s negative-working-capital model (CCC of about -57 days) has funded growth, and Korea\u2019s post-TMON settlement reforms are aimed squarely at it (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-619\">#619<\/a>).<\/p>"}]},{"id":"scenario-analysis-12-month-view","num":"22","title":"Scenario analysis (12-month view)","blocks":[{"t":"table","head":["","Bear (25%)","Base (50%)","Bull (25%)"],"rows":[["PC constant-currency growth FY27 / FY28","+5.5% / +5.5%","+11% / +10%","+14% / +13%"],["PC adj. EBITDA margin FY27 / FY28","5.8% / 6.2%","7.3% / 8.6%","8.0% / 10.0%"],["DO adj. EBITDA FY27 / FY28 (US$m)","-900 / -850","-800 / -600","-750 / -450"],["FY28E revenue (US$bn)","41.5","45.8","48.3"],["FY28E adj. EBITDA (margin)","US$1.27bn (3.1%)","US$2.63bn (5.7%)","US$3.51bn (7.3%)"],["FY28E GAAP EPS","-US$0.20","US$0.42","US$0.79"],["Valuation multiple (NTM sales at Oct-2027)","0.45x (Rakuten / E-MART / Zalando band)","0.85x (below the 0.92x regression value)","1.20x (FY24-25 average)"],["Implied EV/FY28E adj. EBITDA","14.5x","14.5x","16.0x"],["Net debt (cash) assumed","+US$1.2bn (fines, NTS, settlement drain)","+US$0.3bn","-US$0.5bn"],["<strong>Value per share<\/strong>","<strong>US$9.5 (-40%)<\/strong>","<strong>US$21.0 (+33%)<\/strong>","<strong>US$31.8 (+101%)<\/strong>"],["Key triggers","KFTC unbundling; night-delivery ban; settlement drain; share loss","Mid-2027 margin normalisation; DO losses fall","KRW recovery; faster margins; Taiwan inflects; PIPC appeal win"]]},{"t":"c","id":"scenario-analysis-12-month-view--1","html":"<p><strong>Probability-weighted value: US$20.8 (+32%) [e].<\/strong> Upside to the bull case (+101%) is about 2.5x the downside to the bear case (-40%), and the base case alone offers +33%.<\/p>"},{"t":"chart","key":"scenarios","caption":"Scenario values"}]},{"id":"fifteen-questions-for-the-ceo-chairman-ordered-by-information-value","num":"23","title":"Fifteen questions for the CEO / Chairman (ordered by information value)","blocks":[{"t":"c","id":"fifteen-questions-for-the-ceo-chairman-ordered-by-information-value--1","html":"<ol type=\"1\">\n<li>The PC margin recovery date moved from \u201cnext year\u201d to \u201cmid-2027\u201d. Exactly which levers (volume back on the demand curve, promotions, marketing, network rationalisation) get you there, and what PC margin will the 2027 guide embed?<\/li>\n<li>How large is the non-returning cohort in accounts and pre-incident spend, and what evidence do you have on where that spend went?<\/li>\n<li>Quantify the December-2026 settlement-period rules: how much of the US$6.3bn of payables is marketplace settlement float, and what is the cash impact in 2027?<\/li>\n<li>Why fund US$850m of H1\u201926 buybacks alongside a US$750m revolver draw when TTM FCF is ~US$0.1bn? What leverage and FCF guardrails govern the remaining US$907m?<\/li>\n<li>What are the break-even timeline, the investment cap and the kill criteria for Taiwan, and what return hurdle do you apply to Developing Offerings capital?<\/li>\n<li>If the KFTC forces Eats out of WOW, what happens to WOW retention and Eats volume, and what is your contingency?<\/li>\n<li>When will Coupang Corp.\u00a0have a permanent Korean CEO? What does the regulatory \u201cdesignation\u201d concerning you personally mean for your role?<\/li>\n<li>What share of volume is Dawn Delivery, and how would you re-engineer the network under a night-delivery ban?<\/li>\n<li>Is the 10%+ long-term adjusted EBITDA margin target still valid? Why has it not been restated since the incident?<\/li>\n<li>What is the all-in cost of the incident (vouchers, fines, marketing, security), and what residual exposure remains from US and Korean litigation?<\/li>\n<li>Why is the ~US$208m NTS transfer-pricing claim unreserved, and does the CFS / Coupang Corp.\u00a0structure need to change? What does it mean for the effective tax rate?<\/li>\n<li>What insurance cover applies to the ~US$246m Incheon fire exposure, and when do you expect recoveries? Is Q4 peak capacity constrained?<\/li>\n<li>How do you measure wallet-share recapture against Naver\u2019s Plus / Kurly / CJ Logistics alliance and the Chinese platforms? Is further price investment needed?<\/li>\n<li>Will you consider a Class B sunset or succession disclosures? Do you intend to sell further shares after the 15m-share plan?<\/li>\n<li>With Uber consolidating Baemin and Grab buying Foodpanda Taiwan, would you consider partnerships or separations for Eats, Farfetch or Taiwan to crystallise value?<\/li>\n<\/ol>"}]},{"id":"the-short-sellers-case-forensic-and-adversarial","num":"24","title":"The short-seller\u2019s case (forensic and adversarial)","blocks":[{"t":"c","id":"the-short-sellers-case-forensic-and-adversarial--1","html":"<p><strong>What could structurally break how Coupang makes money?<\/strong><\/p><ul>\n<li>The economics depend on three things: a regulator tolerant of overnight labour, bundled memberships, and long settlement terms.<\/li>\n<li>Each is now in play: night-delivery ban (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-861\">#861<\/a>), Eats-WOW bundling (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2008\">#2008<\/a>), and the EFTA / Large-Scale Retail Business Act reforms (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-619\">#619<\/a>).<\/li>\n<li>Remove the payables float and the business needs external capital to grow.<\/li>\n<\/ul><p><strong>Concentration<\/strong><\/p><ul>\n<li>Over 90% of revenue is in Korea (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1858\">#1858<\/a>). Product Commerce is ~86% of revenue and more than 100% of adjusted EBITDA.<\/li>\n<li>A single country\u2019s consumer mood, regulator and currency drive the entire equity.<\/li>\n<li>If Korean shoppers\u2019 default shifts to Naver\u2019s ecosystem (search, then membership, then delivery), there is no second leg. Taiwan and Farfetch are loss-making or marginal.<\/li>\n<\/ul><p><strong>Why the moat is weaker than bulls think<\/strong><\/p><ul>\n<li>Switching costs are behavioural, not contractual.<\/li>\n<li>Naver gained members and GMV within weeks of the breach (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003646016-298\">#298<\/a>).<\/li>\n<li>Coupang needed promotions and marketing to win customers back (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-420\">#420<\/a>).<\/li>\n<li>Regulation works <em>against<\/em> incumbency.<\/li>\n<\/ul><p><strong>The most dangerous competitor: NAVER<\/strong><\/p><ul>\n<li>It owns the top of the funnel (search and price comparison), payments and a membership with Netflix.<\/li>\n<li>It now delivers dawn grocery via Kurly and CJ Logistics without Coupang\u2019s capex (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-321\">#321<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_NONSEC000256804358-326\">#326<\/a>).<\/li>\n<li>Bulls underestimate it because they benchmark Coupang against retailers, not against the traffic gatekeeper.<\/li>\n<\/ul><p><strong>Worst capital allocation<\/strong><\/p><ul>\n<li>About US$1bn a year of Developing Offerings losses (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255972090-56\">#56<\/a>).<\/li>\n<li>The Japan v1 exit (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000002800142-72\">#72<\/a>).<\/li>\n<li>Debt-funded buybacks at ~US$27.6 in 2025 and ~US$19.5 in 2026, against a price now of US$15.82.<\/li>\n<li>The Greenoaks buyout at ~US$122-140m against US$70m contributed (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237408246-1956\">#1956<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2052\">#2052<\/a>).<\/li>\n<\/ul><p><strong>Related parties, accounting and incentives<\/strong><\/p><ul>\n<li><strong>Greenoaks.<\/strong> Director Mehta is its Managing Partner (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2050\">#2050<\/a>).<\/li>\n<li><strong>The \u201cadministrative fines\u201d add-back.<\/strong> It is new in 2026 and judgment-based, despite a recurring pattern of fines (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-339\">#339<\/a>).<\/li>\n<li><strong>Vouchers.<\/strong> US$1.2bn was netted against revenue with no accrual at announcement (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-16\">#16<\/a>).<\/li>\n<li><strong>SBC.<\/strong> US$475m in FY25, more than net income, with US$973m unvested (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1886\">#1886<\/a>).<\/li>\n<li><strong>Insider selling plans after the breach.<\/strong> CFO, GC and CAO adopted plans in March-May 2026 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000259645823-300\">#300<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000259645823-303\">#303<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-294\">#294<\/a>).<\/li>\n<li><strong>Founder selling.<\/strong> Bom Kim adopted a 15m-share plan in 2024 (<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000232383623-311\">#311<\/a>).<\/li>\n<\/ul><p><strong>What must hold for today\u2019s price [d].<\/strong> At US$15.82 the EV is ~US$28bn. Assume ~10% revenue CAGR to ~US$54bn in 2030, 20x terminal FCF and a 10% discount rate. Coupang then needs a <strong>~3.8% FCF margin by 2030<\/strong>. That is a return to FY23-24 levels (7.2% and 3.3%), against 0.3% today.<\/p><p><strong>If growth disappoints by 20-30% [d]<\/strong><\/p>"},{"t":"table","head":["Scenario","Revenue CAGR","2030 revenue","2030 FCF margin","Implied value per share","Change"],"rows":[["Growth -20%","8%","~US$50bn","3.8%","~US$14.5","-8%"],["Growth -30%, margin also slips","7%","~US$48bn","3.0%","~US$11","-30%"]]},{"t":"c","id":"the-short-sellers-case-forensic-and-adversarial--2","html":"<p>The stock is far more sensitive to margin than to growth.<\/p><p><strong>The single scenario that would permanently impair the business.<\/strong> A Korean regulatory package that simultaneously:<\/p><ul>\n<li>bans night deliveries;<\/li>\n<li>forces membership unbundling;<\/li>\n<li>shortens settlement terms; and<\/li>\n<li>reclassifies delivery partners as employees.<\/li>\n<\/ul><p>That combination would convert Coupang into a low-margin, capital-hungry retailer worth ~0.4-0.5x sales (~US$8-10 a share). <strong>Plausibility: low to moderate (~10-15%).<\/strong> Each element exists today, but the full combination would require a political shift against a 100,000-plus employer at a time of weak consumption.<\/p>"}]},{"id":"forensic-accounting-review-red-flags","num":"25","title":"Forensic accounting review: red flags","blocks":[{"t":"table","head":["Area","Statement","Finding","Severity","Evidence"],"rows":[["Revenue recognition","IS","~US$1.2bn of vouchers booked as reduced revenue on redemption; no liability accrued at announcement; amount redeemed not disclosed","Medium","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-16\">#16<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1761\">#1761<\/a>"],["Revenue recognition","IS","Gross (1P) vs net (3P/FLC) mix shifts distort growth (the 2023 FLC net change cost ~520bp of growth); supplier ad payments reduce COGS","Low-Medium","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-28\">#28<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1745\">#1745<\/a>"],["Segment reporting","IS","New \u201cadministrative fines\u201d add-back (US$410m); costs allocated \u201cbased on usage\u201d; no segment assets; Farfetch inside DO","High","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-339\">#339<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1868\">#1868<\/a>"],["Leases","BS","US$3.03bn of operating leases (more than funded debt) plus US$689m signed but not commenced; the Incheon fire was at a leased FC, so ROU impairment is possible","Medium","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1931\">#1931<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-470\">#470<\/a>"],["Related parties","BS/IS","Greenoaks: contributed US$70m, absorbed ~US$88m of FY24 losses, bought out for US$122m at fair value (US$140m at VWAP)","Medium","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000237408246-1956\">#1956<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-2052\">#2052<\/a>"],["Contingencies","BS","PIPC US$410m accrued but unpaid; NTS ~US$208m unreserved; KFTC bundling case with no estimate; US class actions with no estimate; criminal complaints against executives","High","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-463\">#463<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-345\">#345<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-452\">#452<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000264559057-465\">#465<\/a>"],["Stock-based compensation","IS/CF","US$475m in FY25, more than net income; Q2\u201926 US$161m; US$973m unvested; 386m shares available; evergreen to 2031","Medium","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1886\">#1886<\/a>"],["Goodwill / intangibles","BS","Farfetch recorded with goodwill (no bargain gain); intangibles US$167m; no impairment di "Evidence"],"rows":[["Founded by Bom Kim; initially a Groupon-style deals site; HBS dropout","Founder <strong>verified<\/strong>; origin story and education <strong>[u]<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1181\">#1181<\/a>"],["~28% share of Korean e-commerce","<strong>[u]<\/strong>. Not in S&P/ProntoNLP; the CEO says \u201ca small share\u201d","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-355\">#355<\/a>"],["Cohort chart among the strongest; each cohort spends more each year","<strong>Verified<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-69\">#69<\/a>"],["WOW at KRW7,890/month; price rise in 2024 slowed growth; \u226514m members","2024 rise <strong>verified<\/strong>; KRW price <strong>[u]<\/strong>; 14m <strong>verified as end-2023<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003215027-248\">#248<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000218768452-41\">#41<\/a>"],["~78m sq ft of logistics infrastructure; 108,000 employees","<strong>Verified<\/strong>: >78m sq ft; S&P lists 108,000 employees \u2021","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1295\">#1295<\/a>"],["~100% of Korea within 10km of a Coupang centre by 2027","<strong>[u]<\/strong>. Not found","n/a"],["Five tenets incl.\u00a0long-term FCF and return-on-capital mindset","<strong>Partly verified<\/strong>","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003711263-28\">#28<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_T000003779883-116\">#116<\/a>"],["Bom Kim controls 100% of Class B at 29x votes","<strong>Verified<\/strong>; 74.1% of voting power","<a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1181\">#1181<\/a>, <a href=\"https://gam.prontonlp.com/#/ref/$SENTID_SEC000255973354-1187\">#1187<\/a>"],["US$26bn market cap","~US$25-28.5bn depending on date and share count (ProntoNLP market-cap field US$24.9bn; our price \u00d7 diluted shares US$28.5bn)","ProntoNLP \u2021"],["\u201cGlitch or lasting change?\u201d","<strong>Our view:<\/strong> a glitch for customers; a lasting change for regulatory intensity and the cash model. Net, mispriced to the downside","This report"]]}]},{"id":"appendix-methodology-and-data-notes","num":"","title":"Appendix: methodology and data notes","blocks":[{"t":"c","id":"appendix-methodology-and-data-notes--1","html":"<ul>\n<li><strong>Sources.<\/strong> S&amp;P Global Capital IQ (via the S&amp;P Deterministic Retrieval MCP) supplied financial statements and line items for Coupang, 15 listed peers and transaction targets. ProntoNLP MCP supplied transcripts, SEC and non-SEC filings, prices, consensus, sentiment analytics and peers. No web searches or other sources were used. Five parallel research agents queried ProntoNLP and S&amp;P; their notes and tool logs are summarised in the provenance document.<\/li>\n<li><strong>Price data.<\/strong> ProntoNLP price series return no source links (\u2021). The reference price is the 9-Oct-2026 close. EV uses S&amp;P Q2\u201926 net debt including leases (-US$477m) and diluted weighted shares (1,799m).<\/li>\n<li><strong>FX.<\/strong> No FX rates are available from the connectors. Chinese ADR peers use CNY7.10/US$ and HKD7.80/US$ [e]. KRW, JPY, EUR and PLN peers are valued in local currency, so no FX is needed for multiples. USD market caps use FX implied by ProntoNLP\u2019s USD vs local market-cap fields [d].<\/li>\n<li><strong>Consensus.<\/strong> ProntoNLP consensus is used for historical beats and misses only. Forward 3Q26/4Q26 entries are stale (dated March 2025) and are not used.<\/li>\n<li><strong>Limitations.<\/strong> Proxy contents (executive pay, the beneficial-ownership table), 13F/13G data, short interest, news-driven causes of market-wide moves, and Korean industry deal values are not available through the connectors. These are flagged \u2021 or [u] where relevant.<\/li>\n<\/ul><p><em>This report is for professional investors. It is not investment advice. Figures marked [e] are the analyst\u2019s estimates and rest on assumptions that may prove wrong.<\/em><\/p>"}]}],"charts":{"price":{"series":[["2021-03-08",48.47],["2021-03-15",44.89],["2021-03-22",43.53],["2021-03-29",47.31],["2021-04-05",45.85],["2021-04-12",45.9],["2021-04-19",45.56],["2021-04-26",41.9],["2021-05-03",38.93],["2021-05-10",36.43],["2021-05-17",38.01],["2021-05-24",40.79],["2021-05-31",38.89],["2021-06-07",38.6],["2021-06-14",39.41],["2021-06-21",37.4],["2021-06-28",40.46],["2021-07-05",42.13],["2021-07-12",40.19],["2021-07-19",38.61],["2021-07-26",36.32],["2021-08-02",38.8],["2021-08-09",33.87],["2021-08-16",31.29],["2021-08-23",29.99],["2021-08-30",29.65],["2021-09-06",29.98],["2021-09-13",29.72],["2021-09-20",28.31],["2021-09-27",27.22],["2021-10-04",28.1],["2021-10-11",27.59],["2021-10-18",29],["2021-10-25",29.76],["2021-11-01",29.93],["2021-11-08",26.58],["2021-11-15",27.16],["2021-11-22",27.39],["2021-11-29",26.55],["2021-12-06",26.76],["2021-12-13",29.15],["2021-12-20",30.23],["2021-12-27",29.38],["2022-01-03",25.97],["2022-01-10",21.21],["2022-01-17",18.1],["2022-01-24",18.92],["2022-01-31",20.84],["2022-02-07",22.55],["2022-02-14",22.99],["2022-02-21",25],["2022-02-28",21.1],["2022-03-07",17.42],["2022-03-14",19.24],["2022-03-21",17.7],["2022-03-28",18.37],["2022-04-04",17.79],["2022-04-11",16.88],["2022-04-18",14.07],["2022-04-25",12.87],["2022-05-02",12.04],["2022-05-09",13.34],["2022-05-16",13],["2022-05-23",13.41],["2022-05-30",12.64],["2022-06-06",11.5],["2022-06-13",11.97],["2022-06-20",12.91],["2022-06-27",15.04],["2022-07-04",15.62],["2022-07-11",15.8],["2022-07-18",17.64],["2022-07-25",17.29],["2022-08-01",19.23],["2022-08-08",18.87],["2022-08-15",17.24],["2022-08-22",17.14],["2022-08-29",16.53],["2022-09-05",18.12],["2022-09-12",17.64],["2022-09-19",16.08],["2022-09-26",16.67],["2022-10-03",19.56],["2022-10-10",16.28],["2022-10-17",15.99],["2022-10-24",17],["2022-10-31",17.06],["
